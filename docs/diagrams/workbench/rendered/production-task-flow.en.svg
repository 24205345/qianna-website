<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="655" viewBox="0 0 1040 655" role="img" aria-labelledby="title desc"><title id="title">How background work continues after the page closes</title><desc id="desc">Separate admission from execution; the page reads saved task status and results.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#838383"/></marker><marker id="arrow-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M9 1L1 5L9 9Z" fill="#838383"/></marker></defs><rect width="1040" height="655" fill="#ffffff"/><text x="24" y="36" text-anchor="start" fill="#202020" font-family="Georgia, SimSun, serif" font-size="24" font-weight="400"><tspan x="24" dy="0">How background work continues after the page closes</tspan></text><text x="24" y="68" text-anchor="start" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400"><tspan x="24" dy="0">Register and return a task entry; continue in the background and read progress later.</tspan></text><circle cx="130" cy="175" r="28" fill="#f9f9f9" stroke="#d9d9d9"/><svg x="114" y="159" xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#202020" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-monitor" aria-hidden="true"><rect width="20" height="14" x="2" y="3" rx="2"></rect><line x1="8" x2="16" y1="21" y2="21"></line><line x1="12" x2="12" y1="17" y2="21"></line></svg><text x="130" y="229" text-anchor="middle" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19" font-weight="600"><tspan x="130" dy="0">Page</tspan></text><text x="130" y="259" text-anchor="middle" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400"><tspan x="130" dy="0">Submit · revisit results</tspan></text><circle cx="520" cy="175" r="28" fill="#f9f9f9" stroke="#d9d9d9"/><svg x="504" y="159" xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#202020" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-shield-check" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"></path><path d="m9 12 2 2 4-4"></path></svg><text x="520" y="229" text-anchor="middle" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19" font-weight="600"><tspan x="520" dy="0">Application server</tspan></text><text x="520" y="259" text-anchor="middle" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400"><tspan x="520" dy="0">Validate identity and input</tspan></text><circle cx="880" cy="175" r="28" fill="#f9f9f9" stroke="#d9d9d9"/><svg x="864" y="159" xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#202020" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-database" aria-hidden="true"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M3 5V19A9 3 0 0 0 21 19V5"></path><path d="M3 12A9 3 0 0 0 21 12"></path></svg><text x="880" y="229" text-anchor="middle" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19" font-weight="600"><tspan x="880" dy="0">Database</tspan></text><text x="880" y="259" text-anchor="middle" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400"><tspan x="880" dy="0">Owner · status</tspan><tspan x="880" dy="21.75">Result locations</tspan></text><circle cx="130" cy="425" r="28" fill="#f9f9f9" stroke="#d9d9d9"/><svg x="114" y="409" xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#202020" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-list-checks" aria-hidden="true"><path d="M13 5h8"></path><path d="M13 12h8"></path><path d="M13 19h8"></path><path d="m3 17 2 2 4-4"></path><path d="m3 7 2 2 4-4"></path></svg><text x="130" y="479" text-anchor="middle" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19" font-weight="600"><tspan x="130" dy="0">Queue</tspan></text><text x="130" y="509" text-anchor="middle" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400"><tspan x="130" dy="0">Pending task identifiers</tspan></text><circle cx="520" cy="425" r="28" fill="#f9f9f9" stroke="#d9d9d9"/><svg x="504" y="409" xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#202020" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-workflow" aria-hidden="true"><rect width="8" height="8" x="3" y="3" rx="2"></rect><path d="M7 11v4a2 2 0 0 0 2 2h4"></path><rect width="8" height="8" x="13" y="13" rx="2"></rect></svg><text x="520" y="479" text-anchor="middle" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19" font-weight="600"><tspan x="520" dy="0">Worker</tspan></text><text x="520" y="509" text-anchor="middle" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400"><tspan x="520" dy="0">Download · transcribe</tspan><tspan x="520" dy="21.75">Summarize</tspan></text><circle cx="880" cy="425" r="28" fill="#f9f9f9" stroke="#d9d9d9"/><svg x="864" y="409" xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#202020" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-file-text" aria-hidden="true"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"></path><path d="M14 2v5a1 1 0 0 0 1 1h5"></path><path d="M10 9H8"></path><path d="M16 13H8"></path><path d="M16 17H8"></path></svg><text x="880" y="479" text-anchor="middle" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19" font-weight="600"><tspan x="880" dy="0">File storage</tspan></text><text x="880" y="509" text-anchor="middle" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400"><tspan x="880" dy="0">Media and result files</tspan></text><path d="M177 175H473" fill="none" stroke="#838383" stroke-width="1.5"   marker-start="url(#arrow-start)" marker-end="url(#arrow)"/><text x="257" y="153" text-anchor="start" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" font-weight="400"><tspan x="257" dy="0">Submit / query</tspan></text><path d="M567 175H833" fill="none" stroke="#838383" stroke-width="1.5"   marker-start="url(#arrow-start)" marker-end="url(#arrow)"/><text x="602" y="153" text-anchor="start" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" font-weight="400"><tspan x="602" dy="0">1. Save / read status</tspan></text><path d="M520 286V320H130V389" fill="none" stroke="#838383" stroke-width="1.5"  marker-end="url(#arrow)" /><text x="225" y="306" text-anchor="start" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" font-weight="400"><tspan x="225" dy="0">2. Enqueue an identifier</tspan></text><path d="M177 425H473" fill="none" stroke="#838383" stroke-width="1.5"  marker-end="url(#arrow)" /><text x="257" y="403" text-anchor="start" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" font-weight="400"><tspan x="257" dy="0">3. Claim work</tspan></text><path d="M567 425H833" fill="none" stroke="#838383" stroke-width="1.5"  marker-end="url(#arrow)" /><text x="625" y="403" text-anchor="start" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" font-weight="400"><tspan x="625" dy="0">4. Save artifacts</tspan></text><path d="M520 389V350H880V286" fill="none" stroke="#838383" stroke-width="1.5"  marker-end="url(#arrow)" /><text x="599" y="337" text-anchor="start" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" font-weight="400"><tspan x="599" dy="0">Update progress + locations</tspan></text><text x="24" y="558" text-anchor="start" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400"><tspan x="24" dy="0">Queues carry work IDs; the database records progress; file storage holds media and artifacts.</tspan></text><path d="M24 580L1016 580" fill="none" stroke="#d9d9d9" stroke-width="1.4" /><text x="24" y="609" text-anchor="start" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400"><tspan x="24" dy="0">A restart needs durable records and safe recovery. A background function alone is insufficient.</tspan></text></svg>