<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="670" viewBox="0 0 1040 670" role="img" aria-labelledby="title desc"><title id="title">从视频资料到学习闭环</title><desc id="desc">总结衔接问答与测验，时间戳把学习者带回原片；分享需要主动确认。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#838383"/></marker><marker id="arrow-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M9 1L1 5L9 9Z" fill="#838383"/></marker></defs><rect width="1040" height="670" fill="#ffffff"/><text x="24" y="36" text-anchor="start" fill="#202020" font-family="Georgia, SimSun, serif" font-size="24" font-weight="400"><tspan x="24" dy="0">从视频资料到学习闭环</tspan></text><text x="24" y="68" text-anchor="start" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400"><tspan x="24" dy="0">产品闭环：理解、检验、回看与留存。</tspan></text><circle cx="120" cy="165" r="25" fill="#f9f9f9" stroke="#d9d9d9"/><svg x="106" y="151" xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#202020" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-file-input" aria-hidden="true"><path d="M4 11V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.706.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-1"></path><path d="M14 2v5a1 1 0 0 0 1 1h5"></path><path d="M2 15h10"></path><path d="m9 18 3-3-3-3"></path></svg><text x="120" y="213" text-anchor="middle" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="600"><tspan x="120" dy="0">输入视频</tspan></text><text x="120" y="242" text-anchor="middle" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400"><tspan x="120" dy="0">上传 / 授权链接</tspan></text><circle cx="385" cy="165" r="25" fill="#f9f9f9" stroke="#d9d9d9"/><svg x="371" y="151" xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#202020" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-file-text" aria-hidden="true"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"></path><path d="M14 2v5a1 1 0 0 0 1 1h5"></path><path d="M10 9H8"></path><path d="M16 13H8"></path><path d="M16 17H8"></path></svg><text x="385" y="213" text-anchor="middle" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="600"><tspan x="385" dy="0">整理学习材料</tspan></text><text x="385" y="242" text-anchor="middle" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400"><tspan x="385" dy="0">总结、章节</tspan><tspan x="385" dy="21.75">字幕与思维导图</tspan></text><circle cx="650" cy="165" r="25" fill="#f9f9f9" stroke="#d9d9d9"/><svg x="636" y="151" xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#202020" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-messages-square" aria-hidden="true"><path d="M16 10a2 2 0 0 1-2 2H6.828a2 2 0 0 0-1.414.586l-2.202 2.202A.71.71 0 0 1 2 14.286V4a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path><path d="M20 9a2 2 0 0 1 2 2v10.286a.71.71 0 0 1-1.212.502l-2.202-2.202A2 2 0 0 0 17.172 19H10a2 2 0 0 1-2-2v-1"></path></svg><text x="650" y="213" text-anchor="middle" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="600"><tspan x="650" dy="0">检验理解</tspan></text><text x="650" y="242" text-anchor="middle" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400"><tspan x="650" dy="0">问答追问</tspan><tspan x="650" dy="21.75">生成测验与作答</tspan></text><circle cx="915" cy="165" r="25" fill="#f9f9f9" stroke="#d9d9d9"/><svg x="901" y="151" xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke=