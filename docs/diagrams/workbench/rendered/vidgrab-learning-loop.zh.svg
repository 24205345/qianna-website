ight="28" viewBox="0 0 24 24" fill="none" stroke="#202020" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-database" aria-hidden="true"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M3 5V19A9 3 0 0 0 21 19V5"></path><path d="M3 12A9 3 0 0 0 21 12"></path></svg><text x="150" y="518" text-anchor="middle" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="600"><tspan x="150" dy="0">学习记录</tspan></text><text x="150" y="547" text-anchor="middle" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400"><tspan x="150" dy="0">PostgreSQL 记录</tspan><tspan x="150" dy="21.75">媒体存入文件存储</tspan></text><circle cx="800" cy="470" r="25" fill="#f9f9f9" stroke="#d9d9d9"/><svg x="786" y="456" xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#202020" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-users" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><path d="M16 3.128a4 4 0 0 1 0 7.744"></path><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><circle cx="9" cy="7" r="4"></circle></svg><text x="800" y="518" text-anchor="middle" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="600"><tspan x="800" dy="0">学习社区</tspan></text><text x="800" y="547" text-anchor="middle" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400"><tspan x="800" dy="0">分享与讨论</tspan><tspan x="800" dy="21.75">撤回与管理</tspan></text><path d="M24 595L1016 595" fill="none" stroke="#d9d9d9" stroke-width="1.4" /><text x="24" y="624" text-anchor="start" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400"><tspan x="24" dy="0">结果可以进入学习记录；社区发布是独立动作，不会自动公开私人视频。</tspan></text></svg>