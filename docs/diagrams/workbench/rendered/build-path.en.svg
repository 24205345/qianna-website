<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="391" viewBox="0 0 1040 391" role="img" aria-labelledby="title desc"><title id="title">Build it, try it, then add more</title><desc id="desc">Choose the scope, commit existing code, then let the AI build and test. Try it before extending it.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#838383"/></marker><marker id="arrow-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M9 1L1 5L9 9Z" fill="#838383"/></marker></defs><rect width="1040" height="391" fill="#ffffff"/><text x="24" y="36" text-anchor="start" fill="#202020" font-family="Georgia, SimSun, serif" font-size="24" font-weight="400"><tspan x="24" dy="0">Build it, try it, then add more</tspan></text><text x="24" y="68" text-anchor="start" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400"><tspan x="24" dy="0">One working practice session comes before extra features.</tspan></text><circle cx="104" cy="151" r="25" fill="#f9f9f9" stroke="#d9d9d9"/><svg x="91" y="138" xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#202020" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-file-text" aria-hidden="true"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"></path><path d="M14 2v5a1 1 0 0 0 1 1h5"></path><path d="M10 9H8"></path><path d="M16 13H8"></path><path d="M16 17H8"></path></svg><path d="M140 151H274" fill="none" stroke="#838383" stroke-width="1.5"  marker-end="url(#arrow)" /><text x="104" y="218" text-anchor="middle" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="600"><tspan x="104" dy="0">Choose this build</tspan></text><text x="104" y="263" text-anchor="middle" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400"><tspan x="104" dy="0">One complete task</tspan></text><circle cx="312" cy="151" r="25" fill="#f9f9f9" stroke="#d9d9d9"/><svg x="299" y="138" xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#202020" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-git-branch" aria-hidden="true"><path d="M15 6a9 9 0 0 0-9 9V3"></path><circle cx="18" cy="6" r="3"></circle><circle cx="6" cy="18" r="3"></circle></svg><path d="M348 151H482" fill="none" stroke="#838383" stroke-width="1.5"  marker-end="url(#arrow)" /><text x="312" y="218" text-anchor="middle" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="600"><tspan x="312" dy="0">Commit existing code</tspan></text><text x="312" y="263" text-anchor="middle" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400"><tspan x="312" dy="0">Keep a working version</tspan></text><circle cx="520" cy="151" r="25" fill="#f9f9f9" stroke="#d9d9d9"/><svg x="507" y="138" xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#202020" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-list-checks" aria-hidden="true"><path d="M13 5h8"></path><path d="M13 12h8"></path><path d="M13 19h8"></path><path d="m3 17 2 2 4-4"></path><path d="m3 7 2 2 4-4"></path></svg><path d="M556 151H690" fill="none" stroke="#838383" stroke-width="1.5"  marker-end="url(#arrow)" /><text x="520" y="218" text-anchor="middle" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="600"><tspan x="520" dy="0">AI builds and tests</tspan></text><text x="520" y="263" text-anchor="middle" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400"><tspan x="520" dy="0">Run, check, and fix</tspan></text><circle cx="728" cy="151" r="25" fill="#f9f9f9" stroke="#d9d9d9"/><svg x="715" y="138" xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#202020" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-user-round lucide-user-2" aria-hidden="true"><circle cx="12" cy="8" r="5"></circle><path d="M20 21a8 8 0 0 0-16 0"></path></svg><path d="M764 151H898" fill="none" stroke="#838383" stroke-width="1.5"  marker-end="url(#arrow)" /><text x="728" y="218" text-anchor="middle" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="600"><tspan x="728" dy="0">You try it</tspan></text><text x="728" y="263" text-anchor="middle" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400"><tspan x="728" dy="0">Try your own material</tspan></text><circle cx="936" cy="151" r="25" fill="#f9f9f9" stroke="#d9d9d9"/><svg x="923" y="138" xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#202020" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-workflow" aria-hidden="true"><rect width="8" height="8" x="3" y="3" rx="2"></rect><path d="M7 11v4a2 2 0 0 0 2 2h4"></path><rect width="8" height="8" x="13" y="13" rx="2"></rect></svg><text x="936" y="218" text-anchor="middle" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="600"><tspan x="936" dy="0">Add one feature</tspan></text><text x="936" y="263" text-anchor="middle" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400"><tspan x="936" dy="0">Keep old features working</tspan></text><path d="M24 316L1016 316" fill="none" stroke="#d9d9d9" stroke-width="1.4" /><text x="24" y="345" text-anchor="start" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400"><tspan x="24" dy="0">Fix problems first. Commit the working version before each new feature.</tspan></text></svg>