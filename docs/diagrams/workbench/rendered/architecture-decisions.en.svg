<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="521" viewBox="0 0 1040 521" role="img" aria-labelledby="title desc"><title id="title">Turn an AI proposal into a decision</title><desc id="desc">A recommendation stays provisional until its direction-changing assumptions are checked.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#838383"/></marker><marker id="arrow-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M9 1L1 5L9 9Z" fill="#838383"/></marker></defs><rect width="1040" height="521" fill="#ffffff"/><text x="24" y="36" text-anchor="start" fill="#202020" font-family="Georgia, SimSun, serif" font-size="24" font-weight="400"><tspan x="24" dy="0">Turn an AI proposal into a decision</tspan></text><text x="24" y="68" text-anchor="start" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400"><tspan x="24" dy="0">Use product constraints to assess AI recommendations and test decisive assumptions.</tspan></text><svg x="32" y="124" xmlns="http://www.w3.org/2000/svg" width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="#202020" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-sliders-horizontal" aria-hidden="true"><path d="M10 5H3"></path><path d="M12 19H3"></path><path d="M14 3v4"></path><path d="M16 17v4"></path><path d="M21 12h-9"></path><path d="M21 19h-5"></path><path d="M21 5h-7"></path><path d="M8 10v4"></path><path d="M8 12H3"></path></svg><text x="32" y="184" text-anchor="start" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19" font-weight="600"><tspan x="32" dy="0">Product constraints</tspan></text><text x="32" y="224" text-anchor="start" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400"><tspan x="32" dy="0">PRD · platforms · team ·</tspan><tspan x="32" dy="21.75">resources</tspan></text><path d="M278 166H299" fill="none" stroke="#838383" stroke-width="1.5"  marker-end="url(#arrow)" /><svg x="317" y="124" xmlns="http://www.w3.org/2000/svg" width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="#202020" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-git-compare-arrows" aria-hidden="true"><circle cx="5" cy="6" r="3"></circle><path d="M12 6h5a2 2 0 0 1 2 2v7"></path><path d="m15 9-3-3 3-3"></path><circle cx="19" cy="18" r="3"></circle><path d="M12 18H7a2 2 0 0 1-2-2V9"></path><path d="m9 15 3 3-3 3"></path></svg><text x="317" y="184" text-anchor="start" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19" font-weight="600"><tspan x="317" dy="0">Compare candidates</tspan></text><text x="317" y="224" text-anchor="start" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400"><tspan x="317" dy="0">Same requirements; explicit</tspan><tspan x="317" dy="21.75">trade-offs</tspan></text><path d="M563 166H584" fill="none" stroke="#838383" stroke-width="1.5"  marker-end="url(#arrow)" /><svg x="602" y="124" xmlns="http://www.w3.org/2000/svg" width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="#202020" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-scan-search" aria-hidden="true"><path d="M3 7V5a2 2 0 0 1 2-2h2"></path><path d="M17 3h2a2 2 0 0 1 2 2v2"></path><path d="M21 17v2a2 2 0 0 1-2 2h-2"></path><path d="M7 21H5a2 2 0 0 1-2-2v-2"></path><circle cx="12" cy="12" r="3"></circle><path d="m16 16-1.9-1.9"></path></svg><text x="602" y="184" text-anchor="start" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19" font-weight="600"><tspan x="602" dy="0">Check the assumptions</tspan></text><text x="602" y="224" text-anchor="start" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400"><tspan x="602" dy="0">Official docs + a critical</tspan><tspan x="602" dy="21.75">experiment</tspan></text><path d="M714 251V278" fill="none" stroke="#838383" stroke-width="1.5"  marker-end="url(#arrow)" /><path d="M714 283L800 333L714 383L628 333Z" fill="#f9f9f9" stroke="#838383"/><text x="714" y="340" text-anchor="middle" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" font-weight="600"><tspan x="714" dy="0">Fits the product?</tspan></text><path d="M804 333H858" fill="none" stroke="#838383" stroke-width="1.5"  marker-end="url(#arrow)" /><text x="829" y="319" text-anchor="middle" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" font-weight="400"><tspan x="829" dy="0">Yes</tspan></text><svg x="891" y="286" xmlns="http://www.w3.org/2000/svg" width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="#202020" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-check" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg><text x="887" y="344" text-anchor="start" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="600"><tspan x="887" dy="0">Record the</tspan><tspan x="887" dy="26.099999999999998">choice</tspan></text><text x="887" y="397" text-anchor="start" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400"><tspan x="887" dy="0">Reasons + costs</tspan></text><path d="M624 333H441V266" fill="none" stroke="#838383" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)" /><text x="444" y="320" text-anchor="start" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400"><tspan x="444" dy="0">No · revise candidate</tspan></text><path d="M24 446L1016 446" fill="none" stroke="#d9d9d9" stroke-width="1.4" /><text x="24" y="475" text-anchor="start" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400"><tspan x="24" dy="0">An AI recommendation stays provisional until its decisive assumptions have been checked.</tspan></text></svg>