<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="651" viewBox="0 0 1040 651" role="img" aria-labelledby="title desc"><title id="title">屏幕变了，任务顺序不变</title><desc id="desc">次要材料面板可以收进抽屉；当前作答不能因切换而丢失。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#838383"/></marker><marker id="arrow-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M9 1L1 5L9 9Z" fill="#838383"/></marker></defs><rect width="1040" height="651" fill="#ffffff"/><text x="24" y="36" text-anchor="start" fill="#202020" font-family="Georgia, SimSun, serif" font-size="24" font-weight="400"><tspan x="24" dy="0">屏幕变了，任务顺序不变</tspan></text><text x="24" y="68" text-anchor="start" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400"><tspan x="24" dy="0">调整布局，不改变用户正在完成的任务。</tspan></text><text x="40" y="124" text-anchor="start" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21" font-weight="600"><tspan x="40" dy="0">桌面</tspan></text><rect x="40" y="147" width="580" height="305" rx="8" fill="none" stroke="#d9d9d9" /><rect x="60" y="168" width="325" height="261" rx="4" fill="#f9f9f9" stroke="#d9d9d9" /><rect x="401" y="168" width="198" height="261" rx="4" fill="none" stroke="#d9d9d9" /><text x="82" y="206" text-anchor="start" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20" font-weight="400"><tspan x="82" dy="0">题目与作答</tspan></text><text x="82" y="237" text-anchor="start" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400"><tspan x="82" dy="0">主要任务</tspan></text><text x="420" y="206" text-anchor="start" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19" font-weight="400"><tspan x="420" dy="0">参考材料</tspan></text><text x="420" y="237" text-anchor="start" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400"><tspan x="420" dy="0">按需查阅</tspan></text><path d="M83 270L357 270" fill="none" stroke="#d9d9d9" stroke-width="1.4" /><path d="M83 300L357 300" fill="none" stroke="#d9d9d9" stroke-width="1.4" /><rect x="83" y="355" width="150" height="42" rx="4" fill="#ffffff" stroke="#d9d9d9" /><text x="103" y="383" text-anchor="start" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="400"><tspan x="103" dy="0">提交</tspan></text><text x="725" y="124" text-anchor="start" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21" font-weight="600"><tspan x="725" dy="0">手机</tspan></text><rect x="725" y="147" width="272" height="385" rx="15" fill="none" stroke="#d9d9d9" /><text x="747" y="195" text-anchor="start" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19" font-weight="400"><tspan x="747" dy="0">题目与作答</tspan></text><text x="747" y="226" text-anchor="start" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400"><tspan x="747" dy="0">同一份草稿</tspan></text><path d="M747 261L975 261" fill="none" stroke="#d9d9d9" stroke-width="1.4" /><path d="M747 292L975 292" fill="none" stroke="#d9d9d9" stroke-width="1.4" /><rect x="747" y="331" width="228" height="43" rx="4" fill="#f9f9f9" stroke="#d9d9d9" /><text x="767" y="360" text-anchor="start" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="400"><tspan x="767" dy="0">提交</tspan></text><text x="747" y="417" text-anchor="start" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="400"><tspan x="747" dy="0">查看材料 →</tspan></text><text x="747" y="465" text-anchor="start" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400"><tspan x="747" dy="0">打开抽屉，关闭后回到这里。</tspan></text><path d="M24 576L1016 576" fill="none" stroke="#d9d9d9" stroke-width="1.4" /><text x="24" y="605" text-anchor="start" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400"><tspan x="24" dy="0">检查窄屏、长内容、键盘焦点，以及关闭材料后能否继续作答。</tspan></text></svg>