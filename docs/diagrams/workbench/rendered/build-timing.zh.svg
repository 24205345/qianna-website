<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="567" viewBox="0 0 1040 567" role="img" aria-labelledby="title desc"><title id="title">生成慢了，先看时间花在哪里</title><desc id="desc">示意图，没有实际耗时数据；三题一起返回时，看到题目和全部完成可能是同一时刻。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#838383"/></marker><marker id="arrow-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M9 1L1 5L9 9Z" fill="#838383"/></marker></defs><rect width="1040" height="567" fill="#ffffff"/><text x="24" y="36" text-anchor="start" fill="#202020" font-family="Georgia, SimSun, serif" font-size="24" font-weight="400"><tspan x="24" dy="0">生成慢了，先看时间花在哪里</tspan></text><text x="24" y="68" text-anchor="start" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400"><tspan x="24" dy="0">按钮点下去后，什么时候收到请求、看到题目、全部生成完？</tspan></text><path d="M70 172H983" fill="none" stroke="#838383" stroke-width="1.5"  marker-end="url(#arrow)" /><circle cx="70" cy="172" r="5" fill="#202020" stroke="#d9d9d9"/><text x="108" y="125" text-anchor="middle" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="600"><tspan x="108" dy="0">点击</tspan></text><text x="108" y="218" text-anchor="middle" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400"><tspan x="108" dy="0">开始计时</tspan></text><circle cx="285" cy="172" r="5" fill="#202020" stroke="#d9d9d9"/><text x="285" y="125" text-anchor="middle" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="600"><tspan x="285" dy="0">收到请求</tspan></text><text x="285" y="218" text-anchor="middle" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400"><tspan x="285" dy="0">开始处理</tspan></text><circle cx="665" cy="172" r="5" fill="#202020" stroke="#d9d9d9"/><text x="665" y="125" text-anchor="middle" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="600"><tspan x="665" dy="0">看到题目</tspan></text><text x="665" y="218" text-anchor="middle" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400"><tspan x="665" dy="0">可以开始看</tspan></text><circle cx="955" cy="172" r="5" fill="#202020" stroke="#d9d9d9"/><text x="932" y="125" text-anchor="middle" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="600"><tspan x="932" dy="0">全部生成完</tspan></text><text x="932" y="218" text-anchor="middle" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400"><tspan x="932" dy="0">三道题都能用</tspan></text><rect x="285" y="280" width="670" height="116" rx="4" fill="none" stroke="#d9d9d9" stroke-dasharray="5 5"/><svg x="309" y="303" xmlns="http://www.w3.org/2000/svg" width="29" height="29" viewBox="0 0 24 24" fill="none" stroke="#202020" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-cloud" aria-hidden="true"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"></path></svg><text x="360" y="323" text-anchor="start" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19" font-weight="400"><tspan x="360" dy="0">模型出题 → 检查结果 → 页面显示</tspan></text><text x="309" y="369" text-anchor="start" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="400"><tspan x="309" dy="0">单独记录等模型花了多久。</tspan></text><path d="M665 246V260H955V246" fill="none" stroke="#838383" stroke-width="1.5" stroke-dasharray="5 5"  /><text x="70" y="448" text-anchor="start" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" font-weight="400"><tspan x="70" dy="0">三题一起返回时：看到题目和全部生成完，可能是同一时刻。</tspan></text><path d="M24 492L1016 492" fill="none" stroke="#d9d9d9" stroke-width="1.4" /><text x="24" y="521" text-anchor="start" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400"><tspan x="24" dy="0">先看到题目，不代表全部生成得更快。图中没有实际用时。</tspan></text></svg>