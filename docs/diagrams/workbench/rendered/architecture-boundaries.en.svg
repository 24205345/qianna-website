<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="555" viewBox="0 0 1040 555" role="img" aria-labelledby="title desc"><title id="title">Name the responsibility boundaries</title><desc id="desc">The application server can live in the same full-stack app. This is a responsibility map, not a microservice prescription.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#838383"/></marker><marker id="arrow-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M9 1L1 5L9 9Z" fill="#838383"/></marker></defs><rect width="1040" height="555" fill="#ffffff"/><text x="24" y="36" text-anchor="start" fill="#202020" font-family="Georgia, SimSun, serif" font-size="24" font-weight="400"><tspan x="24" dy="0">Name the responsibility boundaries</tspan></text><text x="24" y="68" text-anchor="start" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400"><tspan x="24" dy="0">Practice-session example: separate interaction, trusted checks and external generation.</tspan></text><svg x="53" y="145" xmlns="http://www.w3.org/2000/svg" width="37" height="37" viewBox="0 0 24 24" fill="none" stroke="#202020" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-monitor" aria-hidden="true"><rect width="20" height="14" x="2" y="3" rx="2"></rect><line x1="8" x2="16" y1="21" y2="21"></line><line x1="12" x2="12" y1="17" y2="21"></line></svg><text x="53" y="211" text-anchor="start" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21" font-weight="600"><tspan x="53" dy="0">Client</tspan></text><text x="53" y="249" text-anchor="start" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" font-weight="400"><tspan x="53" dy="0">Input and progress</tspan><tspan x="53" dy="24.65">Answer and review</tspan><tspan x="53" dy="24.65">Keep input after failure</tspan></text><text x="53" y="404" text-anchor="start" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="600"><tspan x="53" dy="0">No provider secrets</tspan></text><rect x="366" y="110" width="309" height="345" rx="4" fill="none" stroke="#838383" stroke-dasharray="5 5"/><svg x="389" y="133" xmlns="http://www.w3.org/2000/svg" width="31" height="31" viewBox="0 0 24 24" fill="none" stroke="#202020" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-shield-check" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"></path><path d="m9 12 2 2 4-4"></path></svg><text x="389" y="202" text-anchor="start" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21" font-weight="600"><tspan x="389" dy="0">Application server</tspan></text><text x="389" y="229" text-anchor="start" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400"><tspan x="389" dy="0">Trusted boundary</tspan></text><circle cx="397" cy="271" r="4" fill="#202020" stroke="#d9d9d9"/><path d="M397 280V326" fill="none" stroke="#838383" stroke-width="1.5"   /><text x="416" y="277" text-anchor="start" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="400"><tspan x="416" dy="0">Validate input + access</tspan></text><circle cx="397" cy="337" r="4" fill="#202020" stroke="#d9d9d9"/><path d="M397 346V392" fill="none" stroke="#838383" stroke-width="1.5"   /><text x="416" y="343" text-anchor="start" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="400"><tspan x="416" dy="0">Call with a server secret</tspan></text><circle cx="397" cy="403" r="4" fill="#202020" stroke="#d9d9d9"/><text x="416" y="409" text-anchor="start" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="400"><tspan x="416" dy="0">Validate the output</tspan></text><svg x="795" y="145" xmlns="http://www.w3.org/2000/svg" width="43" height="43" viewBox="0 0 24 24" fill="none" stroke="#202020" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-cloud" aria-hidden="true"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"></path></svg><text x="795" y="222" text-anchor="start" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20" font-weight="600"><tspan x="795" dy="0">Generation service</tspan></text><text x="795" y="299" text-anchor="start" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" font-weight="400"><tspan x="795" dy="0">Candidate content</tspan><tspan x="795" dy="24.65">May fail or time out</tspan></text><path d="M289 270H360" fill="none" stroke="#838383" stroke-width="1.5"  marker-end="url(#arrow)" /><text x="323" y="255" text-anchor="middle" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" font-weight="400"><tspan x="323" dy="0">Input</tspan></text><path d="M360 426H289" fill="none" stroke="#838383" stroke-width="1.5"  marker-end="url(#arrow)" /><text x="327" y="410" text-anchor="middle" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="13" font-weight="400"><tspan x="327" dy="0">Result / error</tspan></text><path d="M681 337H773" fill="none" stroke="#838383" stroke-width="1.5"  marker-end="url(#arrow)" /><text x="725" y="322" text-anchor="middle" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" font-weight="400"><tspan x="725" dy="0">Generate</tspan></text><path d="M773 401H681" fill="none" stroke="#838383" stroke-width="1.5"  marker-end="url(#arrow)" /><text x="725" y="385" text-anchor="middle" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" font-weight="400"><tspan x="725" dy="0">Candidate</tspan></text><path d="M24 480L1016 480" fill="none" stroke="#d9d9d9" stroke-width="1.4" /><text x="24" y="509" text-anchor="start" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400"><tspan x="24" dy="0">These are responsibilities, not a microservice requirement. The server can be part of one full-stack app.</tspan></text></svg>