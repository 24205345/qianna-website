<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="496" viewBox="0 0 1040 496" role="img" aria-labelledby="title desc"><title id="title">Two ways to reach a clear problem</title><desc id="desc">An outline and an open conversation are complementary starting points. Revisit uncertain parts as evidence changes.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#838383"/></marker><marker id="arrow-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M9 1L1 5L9 9Z" fill="#838383"/></marker></defs><rect width="1040" height="496" fill="#ffffff"/><text x="24" y="36" text-anchor="start" fill="#202020" font-family="Georgia, SimSun, serif" font-size="24" font-weight="400"><tspan x="24" dy="0">Two ways to reach a clear problem</tspan></text><text x="24" y="68" text-anchor="start" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400"><tspan x="24" dy="0">Different starting points lead to the same product questions.</tspan></text><circle cx="50" cy="166" r="21" fill="#f9f9f9" stroke="#d9d9d9"/><text x="50" y="172" text-anchor="middle" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="600"><tspan x="50" dy="0">A</tspan></text><text x="92" y="163" text-anchor="start" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19" font-weight="600"><tspan x="92" dy="0">An initial outline</tspan></text><text x="92" y="193" text-anchor="start" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400"><tspan x="92" dy="0">Users, features, constraints,</tspan><tspan x="92" dy="21.75">evidence</tspan></text><path d="M349 166H385" fill="none" stroke="#838383" stroke-width="1.5"  marker-end="url(#arrow)" /><svg x="409" y="132" xmlns="http://www.w3.org/2000/svg" width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="#202020" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-list-checks" aria-hidden="true"><path d="M13 5h8"></path><path d="M13 12h8"></path><path d="M13 19h8"></path><path d="m3 17 2 2 4-4"></path><path d="m3 7 2 2 4-4"></path></svg><text x="410" y="176" text-anchor="start" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="600"><tspan x="410" dy="0">Organize and challenge</tspan></text><path d="M410 197L627 197" fill="none" stroke="#d9d9d9" stroke-width="1.4" /><path d="M642 166H677Q690 166 690 182V235Q690 251 707 251H743" fill="none" stroke="#838383" stroke-width="1.5"  marker-end="url(#arrow)" /><circle cx="50" cy="336" r="21" fill="#f9f9f9" stroke="#d9d9d9"/><text x="50" y="342" text-anchor="middle" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="600"><tspan x="50" dy="0">B</tspan></text><text x="92" y="333" text-anchor="start" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19" font-weight="600"><tspan x="92" dy="0">A vague idea</tspan></text><text x="92" y="363" text-anchor="start" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400"><tspan x="92" dy="0">Clarify one uncertainty at a time</tspan></text><path d="M349 336H385" fill="none" stroke="#838383" stroke-width="1.5"  marker-end="url(#arrow)" /><svg x="409" y="302" xmlns="http://www.w3.org/2000/svg" width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="#202020" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-messages-square" aria-hidden="true"><path d="M16 10a2 2 0 0 1-2 2H6.828a2 2 0 0 0-1.414.586l-2.202 2.202A.71.71 0 0 1 2 14.286V4a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path><path d="M20 9a2 2 0 0 1 2 2v10.286a.71.71 0 0 1-1.212.502l-2.202-2.202A2 2 0 0 0 17.172 19H10a2 2 0 0 1-2-2v-1"></path></svg><text x="410" y="346" text-anchor="start" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="600"><tspan x="410" dy="0">Explore real experiences</tspan></text><path d="M410 367L627 367" fill="none" stroke="#d9d9d9" stroke-width="1.4" /><path d="M642 336H677Q690 336 690 320V235Q690 251 707 251H743" fill="none" stroke="#838383" stroke-width="1.5"  marker-end="url(#arrow)" /><svg x="779" y="162" xmlns="http://www.w3.org/2000/svg" width="35" height="35" viewBox="0 0 24 24" fill="none" stroke="#202020" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-file-check-corner lucide-file-check-2" aria-hidden="true"><path d="M10.5 22H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.706.706l3.588 3.588A2.4 2.4 0 0 1 20 8v6"></path><path d="M14 2v5a1 1 0 0 0 1 1h5"></path><path d="m14 20 2 2 4-4"></path></svg><text x="779" y="224" text-anchor="start" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20" font-weight="600"><tspan x="779" dy="0">Shared product</tspan><tspan x="779" dy="29">definition</tspan></text><text x="779" y="294" text-anchor="start" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="400"><tspan x="779" dy="0">User + situation</tspan><tspan x="779" dy="23.2">Problem + desired outcome</tspan><tspan x="779" dy="23.2">MVP + acceptance + short PRD</tspan></text><path d="M24 421L1016 421" fill="none" stroke="#d9d9d9" stroke-width="1.4" /><text x="24" y="450" text-anchor="start" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400"><tspan x="24" dy="0">The paths can complement each other. Revisit uncertain parts when evidence changes.</tspan></text></svg>