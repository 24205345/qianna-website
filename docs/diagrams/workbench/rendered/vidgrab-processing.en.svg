<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="892" viewBox="0 0 1040 892" role="img" aria-labelledby="title desc"><title id="title">Two inputs, one evidence pipeline</title><desc id="desc">Reuse available captions; otherwise transcribe audio. Short text goes directly to synthesis; long text uses bounded map and reduce.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#838383"/></marker><marker id="arrow-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M9 1L1 5L9 9Z" fill="#838383"/></marker></defs><rect width="1040" height="892" fill="#ffffff"/><text x="24" y="36" text-anchor="start" fill="#202020" font-family="Georgia, SimSun, serif" font-size="24" font-weight="400"><tspan x="24" dy="0">Two inputs, one evidence pipeline</tspan></text><text x="24" y="68" text-anchor="start" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400"><tspan x="24" dy="0">Processing within one application; this is not a durable worker queue.</tspan></text><text x="520" y="112" text-anchor="middle" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" font-weight="600"><tspan x="520" dy="0">Uploaded media / authorized URL</tspan></text><path d="M520 127V145H190V157" fill="none" stroke="#838383" stroke-width="1.5"  marker-end="url(#arrow)" /><path d="M520 145H780V157" fill="none" stroke="#838383" stroke-width="1.5"  marker-end="url(#arrow)" /><circle cx="190" cy="190" r="25" fill="#f9f9f9" stroke="#d9d9d9"/><svg x="176" y="176" xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#202020" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-file-text" aria-hidden="true"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"></path><path d="M14 2v5a1 1 0 0 0 1 1h5"></path><path d="M10 9H8"></path><path d="M16 13H8"></path><path d="M16 17H8"></path></svg><text x="190" y="238" text-anchor="middle" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="600"><tspan x="190" dy="0">Available captions</tspan></text><text x="190" y="267" text-anchor="middle" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400"><tspan x="190" dy="0">Reuse platform text</tspan><tspan x="190" dy="21.75">Skip audio recognition</tspan></text><circle cx="780" cy="190" r="25" fill="#f9f9f9" stroke="#d9d9d9"/><svg x="766" y="176" xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#202020" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-workflow" aria-hidden="true"><rect width="8" height="8" x="3" y="3" rx="2"></rect><path d="M7 11v4a2 2 0 0 0 2 2h4"></path><rect width="8" height="8" x="13" y="13" rx="2"></rect></svg><text x="780" y="238" text-anchor="middle" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="600"><tspan x="780" dy="0">Audio transcription</tspan></text><text x="780" y="267" text-anchor="middle" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400"><tspan x="780" dy="0">Bounded cloud chunks</tspan><tspan x="780" dy="21.75">Local fallback by mode</tspan></text><path d="M190 290V330H477" fill="none" stroke="#838383" stroke-width="1.5"  marker-end="url(#arrow)" /><path d="M780 290V330H563" fill="none" stroke="#838383" stroke-width="1.5"  marker-end="url(#arrow)" /><circle cx="520" cy="330" r="25" fill="#f9f9f9" stroke="#d9d9d9"/><svg x="506" y="316" xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#202020" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-list-checks" aria-hidden="true"><path d="M13 5h8"></path><path d="M13 12h8"></path><path d="M13 19h8"></path><path d="m3 17 2 2 4-4"></path><path d="m3 7 2 2 4-4"></path></svg><text x="520" y="378" text-anchor="middle" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="600"><tspan x="520" dy="0">Ordered transcript</tspan></text><text x="520" y="407" text-anchor="middle" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400"><tspan x="520" dy="0">Preserve original offsets and source order</tspan></text><path d="M520 425V450H190V474" fill="none" stroke="#838383" stroke-width="1.5"  marker-end="url(#arrow)" /><path d="M520 450H780V474" fill="none" stroke="#838383" stroke-width="1.5"  marker-end="url(#arrow)" /><text x="240" y="440" text-anchor="start" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" font-weight="400"><tspan x="240" dy="0">Short text</tspan></text><text x="622" y="440" text-anchor="start" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" font-weight="400"><tspan x="622" dy="0">Long text</tspan></text><circle cx="190" cy="510" r="25" fill="#f9f9f9" stroke="#d9d9d9"/><svg x="176" y="496" xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#202020" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-sparkles lucide-stars" aria-hidden="true"><path d="M11.017 2.814a1 1 0 0 1 1.966 0l1.051 5.558a2 2 0 0 0 1.594 1.594l5.558 1.051a1 1 0 0 1 0 1.966l-5.558 1.051a2 2 0 0 0-1.594 1.594l-1.051 5.558a1 1 0 0 1-1.966 0l-1.051-5.558a2 2 0 0 0-1.594-1.594l-5.558-1.051a1 1 0 0 1 0-1.966l5.558-1.051a2 2 0 0 0 1.594-1.594z"></path><path d="M20 2v4"></path><path d="M22 4h-4"></path><circle cx="4" cy="20" r="2"></circle></svg><text x="190" y="558" text-anchor="middle" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="600"><tspan x="190" dy="0">Direct synthesis</tspan></text><text x="190" y="587" text-anchor="middle" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400"><tspan x="190" dy="0">One summarization request</tspan></text><circle cx="780" cy="510" r="25" fill="#f9f9f9" stroke="#d9d9d9"/><svg x="766" y="496" xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#202020" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-layers lucide-layers-3" aria-hidden="true"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"></path><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"></path><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"></path></svg><text x="780" y="558" text-anchor="middle" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="600"><tspan x="780" dy="0">Chunk notes</tspan></text><text x="780" y="587" text-anchor="middle" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400"><tspan x="780" dy="0">Limited parallel calls</tspan><tspan x="780" dy="21.75">Restore original order</tspan></text><path d="M190 611V650H520V667" fill="none" stroke="#838383" stroke-width="1.5"  marker-end="url(#arrow)" /><path d="M780 611V650H520" fill="none" stroke="#838383" stroke-width="1.5"   /><circle cx="520" cy="703" r="25" fill="#f9f9f9" stroke="#d9d9d9"/><svg x="506" y="689" xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#202020" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-book-open" aria-hidden="true"><path d="M12 5v16"></path><path d="M20.001 19A2 2 0 0022 17V5a2 2 0 00-1.999-2L16 3.002A5 5 0 0012 5a5 5 0 00-4-2H4a2 2 0 00-2 2v12a2 2 0 001.999 2H8a5 5 0 014 2 5 5 0 014-2z"></path></svg><text x="520" y="751" text-anchor="middle" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="600"><tspan x="520" dy="0">Structured learning result</tspan></text><text x="520" y="780" text-anchor="middle" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400"><tspan x="520" dy="0">Synthesis · key points · chapters · mind map</tspan></text><path d="M24 817L1016 817" fill="none" stroke="#d9d9d9" stroke-width="1.4" /><text x="24" y="846" text-anchor="start" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400"><tspan x="24" dy="0">Some ASR sentence times are estimated. Partial output and sampled visuals do not establish full coverage.</tspan></text></svg>