<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="550" viewBox="0 0 1040 550" role="img" aria-labelledby="title desc"><title id="title">AI tests first. You try it next.</title><desc id="desc">If you find a problem, send it to the AI and repeat the steps after repair.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#838383"/></marker><marker id="arrow-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M9 1L1 5L9 9Z" fill="#838383"/></marker></defs><rect width="1040" height="550" fill="#ffffff"/><text x="24" y="36" text-anchor="start" fill="#202020" font-family="Georgia, SimSun, serif" font-size="24" font-weight="400"><tspan x="24" dy="0">AI tests first. You try it next.</tspan></text><text x="24" y="68" text-anchor="start" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400"><tspan x="24" dy="0">It should run correctly and do what you wanted.</tspan></text><circle cx="130" cy="156" r="27" fill="#f9f9f9" stroke="#d9d9d9"/><svg x="116" y="142" xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#202020" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-list-checks" aria-hidden="true"><path d="M13 5h8"></path><path d="M13 12h8"></path><path d="M13 19h8"></path><path d="m3 17 2 2 4-4"></path><path d="m3 7 2 2 4-4"></path></svg><text x="130" y="217" text-anchor="middle" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19" font-weight="600"><tspan x="130" dy="0">AI tests</tspan></text><text x="130" y="249" text-anchor="middle" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400"><tspan x="130" dy="0">Run the app and fix errors</tspan></text><circle cx="412" cy="156" r="27" fill="#f9f9f9" stroke="#d9d9d9"/><svg x="398" y="142" xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#202020" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-user-round lucide-user-2" aria-hidden="true"><circle cx="12" cy="8" r="5"></circle><path d="M20 21a8 8 0 0 0-16 0"></path></svg><text x="412" y="217" text-anchor="middle" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19" font-weight="600"><tspan x="412" dy="0">You try it</tspan></text><text x="412" y="249" text-anchor="middle" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400"><tspan x="412" dy="0">Use your own material</tspan></text><path d="M170 156H371" fill="none" stroke="#838383" stroke-width="1.5"  marker-end="url(#arrow)" /><path d="M451 156H589" fill="none" stroke="#838383" stroke-width="1.5"  marker-end="url(#arrow)" /><path d="M690 107L784 156L690 205L596 156Z" fill="#f9f9f9" stroke="#d9d9d9"/><text x="690" y="162" text-anchor="middle" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" font-weight="400"><tspan x="690" dy="0">Works?</tspan></text><path d="M789 156H855" fill="none" stroke="#838383" stroke-width="1.5"  marker-end="url(#arrow)" /><text x="820" y="137" text-anchor="start" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" font-weight="400"><tspan x="820" dy="0">Yes</tspan></text><svg x="908" y="117" xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#202020" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-file-check-corner lucide-file-check-2" aria-hidden="true"><path d="M10.5 22H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.706.706l3.588 3.588A2.4 2.4 0 0 1 20 8v6"></path><path d="M14 2v5a1 1 0 0 0 1 1h5"></path><path d="m14 20 2 2 4-4"></path></svg><text x="923" y="218" text-anchor="middle" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="600"><tspan x="923" dy="0">Save this version</tspan></text><path d="M690 210V314H412V349" fill="none" stroke="#838383" stroke-width="1.5"  marker-end="url(#arrow)" /><text x="528" y="299" text-anchor="start" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400"><tspan x="528" dy="0">No · send the problem</tspan></text><rect x="283" y="354" width="258" height="82" rx="4" fill="#f9f9f9" stroke="#d9d9d9" /><text x="412" y="387" text-anchor="middle" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" font-weight="400"><tspan x="412" dy="0">What did you do?</tspan></text><text x="412" y="416" text-anchor="middle" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400"><tspan x="412" dy="0">Error text / screenshot</tspan></text><path d="M547 395H629" fill="none" stroke="#838383" stroke-width="1.5"  marker-end="url(#arrow)" /><rect x="635" y="354" width="280" height="82" rx="4" fill="none" stroke="#d9d9d9" /><text x="775" y="402" text-anchor="middle" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" font-weight="400"><tspan x="775" dy="0">AI fixes and tests again</tspan></text><path d="M775 349V335H1024V90H412V125" fill="none" stroke="#838383" stroke-width="1.5"  marker-end="url(#arrow)" /><text x="811" y="322" text-anchor="start" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" font-weight="400"><tspan x="811" dy="0">You try again</tspan></text><path d="M24 475L1016 475" fill="none" stroke="#d9d9d9" stroke-width="1.4" /><text x="24" y="504" text-anchor="start" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400"><tspan x="24" dy="0">Repeat the failed steps and check that existing features still work.</tspan></text></svg>