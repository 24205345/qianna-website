<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="704" viewBox="0 0 1040 704" role="img" aria-labelledby="title desc"><title id="title">写请求超时后，先查证再继续</title><desc id="desc">远端可能已经成功；复用原业务操作 ID 查证结果，再推进后续步骤。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#838383"/></marker><marker id="arrow-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M9 1L1 5L9 9Z" fill="#838383"/></marker></defs><rect width="1040" height="704" fill="#ffffff"/><text x="24" y="36" text-anchor="start" fill="#202020" font-family="Georgia, SimSun, serif" font-size="24" font-weight="400"><tspan x="24" dy="0">写请求超时后，先查证再继续</tspan></text><text x="24" y="68" text-anchor="start" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400"><tspan x="24" dy="0">示例：工单创建成功，但响应没有到达执行器。</tspan></text><svg x="141" y="106" xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#202020" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-workflow" aria-hidden="true"><rect width="8" height="8" x="3" y="3" rx="2"></rect><path d="M7 11v4a2 2 0 0 0 2 2h4"></path><rect width="8" height="8" x="13" y="13" rx="2"></rect></svg><text x="155" y="162" text-anchor="middle" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="600"><tspan x="155" dy="0">执行器</tspan></text><path d="M155 179V609" fill="none" stroke="#d9d9d9" stroke-width="1.5" stroke-dasharray="5 5"  /><svg x="521" y="106" xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#202020" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-ticket" aria-hidden="true"><path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"></path><path d="M13 5v2"></path><path d="M13 17v2"></path><path d="M13 11v2"></path></svg><text x="535" y="162" text-anchor="middle" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="600"><tspan x="535" dy="0">工单服务</tspan></text><path d="M535 179V609" fill="none" stroke="#d9d9d9" stroke-width="1.5" stroke-dasharray="5 5"  /><svg x="886" y="106" xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#202020" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-database" aria-hidden="true"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M3 5V19A9 3 0 0 0 21 19V5"></path><path d="M3 12A9 3 0 0 0 21 12"></path></svg><text x="900" y="162" text-anchor="middle" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="600"><tspan x="900" dy="0">操作台账</tspan></text><path d="M900 179V609" fill="none" stroke="#d9d9d9" stroke-width="1.5" stroke-dasharray="5 5"  /><path d="M159 213H896" fill="none" stroke="#838383" stroke-width="1.5"  marker-end="url(#arrow)" /><rect x="206" y="181" width="650" height="26" rx="0" fill="#ffffff" stroke="none" /><text x="211" y="199" text-anchor="start" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="400"><tspan x="211" dy="0">1 · 保存稳定操作 ID 与待执行状态</tspan></text><path d="M159 281H531" fill="none" stroke="#838383" stroke-width="1.5"  marker-end="url(#arrow)" /><rect x="189" y="249" width="340" height="26" rx="0" fill="#ffffff" stroke="none" /><text x="194" y="267" text-anchor="start" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="400"><tspan x="194" dy="0">2 · 携带该操作 ID 创建工单</tspan></text><rect x="562" y="288" width="268" height="38" rx="4" fill="#f9f9f9" stroke="#d9d9d9" /><text x="575" y="313" text-anchor="start" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400"><tspan x="575" dy="0">远端已创建工单</tspan></text><path d="M531 357H259" fill="none" stroke="#838383" stroke-width="1.5" stroke-dasharray="5 5"  /><path d="M246 348L264 366" fill="none" stroke="#838383" stroke-width="1.4" /><path d="M246 366L264 348" fill="none" stroke="#838383" stroke-width="1.4" /><rect x="189" y="325" width="630" height="26" rx="0" fill="#ffffff" stroke="none" /><text x="194" y="343" text-anchor="start" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="400"><tspan x="194" dy="0">3 · 响应丢失，执行器无法确认结果</tspan></text><path d="M159 431H531" fill="none" stroke="#838383" stroke-width="1.5"  marker-end="url(#arrow)" /><rect x="189" y="399" width="340" height="26" rx="0" fill="#ffffff" stroke="none" /><text x="194" y="417" text-anchor="start" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="400"><tspan x="194" dy="0">4 · 使用原操作 ID 查询结果</tspan></text><path d="M531 497H159" fill="none" stroke="#838383" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)" /><rect x="189" y="465" width="340" height="26" rx="0" fill="#ffffff" stroke="none" /><text x="194" y="483" text-anchor="start" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="400"><tspan x="194" dy="0">5 · 返回已存在的工单 ID</tspan></text><path d="M159 564H896" fill="none" stroke="#838383" stroke-width="1.5"  marker-end="url(#arrow)" /><rect x="206" y="532" width="650" height="26" rx="0" fill="#ffffff" stroke="none" /><text x="211" y="550" text-anchor="start" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="400"><tspan x="211" dy="0">6 · 保存已确认结果，继续后续步骤</tspan></text><path d="M24 629L1016 629" fill="none" stroke="#d9d9d9" stroke-width="1.4" /><text x="24" y="658" text-anchor="start" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400"><tspan x="24" dy="0">不新建操作重发；若仍无法查证，保留待核实状态并交给人工。</tspan></text></svg>