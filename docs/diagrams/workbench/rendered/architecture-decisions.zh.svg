rif" font-size="17" font-weight="600"><tspan x="714" dy="0">适配产品？</tspan></text><path d="M804 333H858" fill="none" stroke="#838383" stroke-width="1.5"  marker-end="url(#arrow)" /><text x="829" y="319" text-anchor="middle" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" font-weight="400"><tspan x="829" dy="0">是</tspan></text><svg x="891" y="286" xmlns="http://www.w3.org/2000/svg" width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="#202020" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-check" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg><text x="887" y="344" text-anchor="start" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="600"><tspan x="887" dy="0">记录决定</tspan></text><text x="887" y="397" text-anchor="start" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400"><tspan x="887" dy="0">理由与代价</tspan></text><path d="M624 333H441V266" fill="none" stroke="#838383" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)" /><text x="444" y="320" text-anchor="start" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400"><tspan x="444" dy="0">否 · 调整候选</tspan></text><path d="M24 446L1016 446" fill="none" stroke="#d9d9d9" stroke-width="1.4" /><text x="24" y="475" text-anchor="start" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400"><tspan x="24" dy="0">影响方向的假设未核实前，AI 推荐仍是候选方案。</tspan></text></svg>