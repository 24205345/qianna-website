<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="676" viewBox="0 0 1040 676" role="img" aria-labelledby="title desc"><title id="title">规划与执行，遵守不同的边界</title><desc id="desc">模型提出候选动作；服务端校验、授权并记录业务操作。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#838383"/></marker><marker id="arrow-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M9 1L1 5L9 9Z" fill="#838383"/></marker></defs><rect width="1040" height="676" fill="#ffffff"/><text x="24" y="36" text-anchor="start" fill="#202020" font-family="Georgia, SimSun, serif" font-size="24" font-weight="400"><tspan x="24" dy="0">规划与执行，遵守不同的边界</tspan></text><text x="24" y="68" text-anchor="start" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400"><tspan x="24" dy="0">一次任务穿过身份、规划、授权和业务状态；边界由服务端落实。</tspan></text><rect x="250" y="112" width="488" height="390" rx="4" fill="none" stroke="#838383" stroke-dasharray="5 5"/><text x="272" y="144" text-anchor="start" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="600"><tspan x="272" dy="0">可信的应用服务端</tspan></text><svg x="61" y="196" xmlns="http://www.w3.org/2000/svg" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#202020" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-user-round lucide-user-2" aria-hidden="true"><circle cx="12" cy="8" r="5"></circle><path d="M20 21a8 8 0 0 0-16 0"></path></svg><text x="78" y="262" text-anchor="middle" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19" font-weight="600"><tspan x="78" dy="0">员工</tspan></text><text x="78" y="291" text-anchor="middle" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" font-weight="400"><tspan x="78" dy="0">请求与动作确认</tspan></text><path d="M151 215H271" fill="none" stroke="