<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="528" viewBox="0 0 1040 528" role="img" aria-labelledby="title desc"><title id="title">一条工作流，不同的工具职责</title><desc id="desc">模型负责推理，Agent 组织执行，工具连接外部能力，项目规约约束全过程。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#838383"/></marker><marker id="arrow-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M9 1L1 5L9 9Z" fill="#838383"/></marker></defs><rect width="1040" height="528" fill="#ffffff"/><text x="24" y="36" text-anchor="start" fill="#202020" font-family="Georgia, SimSun, serif" font-size="24" font-weight="400"><tspan x="24" dy="0">一条工作流，不同的工具职责</tspan></text><text x="24" y="68" text-anchor="start" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400"><tspan x="24" dy="0">谁定义结果，各种能力分别负责什么？</tspan></text><svg x="66" y="233" xmlns="http://www.w3.org/2000/svg" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#202020" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-user-round lucide-user-2" aria-hidden="true"><circle cx="12" cy="8" r="5"></circle><path d="M20 21a8 8 0 0 0-16 0"></path></svg><text x="83" y="301" text-anchor="middle" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19" font-weight="600"><tspan x="83" dy="0">你</tspan></text><text x="83" y="330" text-anchor="middle" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400"><tspan x="83" dy="0">目标、约束</tspan><tspan x="83" dy="21.75">与验收</tspan></text><circle cx="350" cy="265" r="49" fill="#f9f9f9" stroke="#d9d9d9"/><svg x="331" y="246" xmlns="http://www.w3.org/2000/svg" width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#202020" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-workflow" aria-hidde