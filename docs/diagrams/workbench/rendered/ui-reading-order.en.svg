<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="588" viewBox="0 0 1040 588" role="img" aria-labelledby="title desc"><title id="title">Give the next action a clear place</title><desc id="desc">A wireframe for the answering state. Explanations appear after submission.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#838383"/></marker><marker id="arrow-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M9 1L1 5L9 9Z" fill="#838383"/></marker></defs><rect width="1040" height="588" fill="#ffffff"/><text x="24" y="36" text-anchor="start" fill="#202020" font-family="Georgia, SimSun, serif" font-size="24" font-weight="400"><tspan x="24" dy="0">Give the next action a clear place</tspan></text><text x="24" y="68" text-anchor="start" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400"><tspan x="24" dy="0">Primary action, optional detail, and conditional feedback.</tspan></text><rect x="110" y="106" width="650" height="416" rx="10" fill="none" stroke="#d9d9d9" /><text x="140" y="145" text-anchor="start" fill="#202020" font-family="Georgia, SimSun, serif" font-size="22" font-weight="400"><tspan x="140" dy="0">Retrieval practice</tspan></text><text x="140" y="179" text-anchor="start" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" font-weight="400"><tspan x="140" dy="0">Question 2 of 5</tspan></text><path d="M140 198L730 198" fill="none" stroke="#d9d9d9" stroke-width="1.4" /><text x="140" y="236" text-anchor="start" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19" font-weight="400"><tspan x="140" dy="0">Which claim is supported by the source?</tspan></text><circle cx="150" cy="284" r="7" fill="#ffffff" stroke="#d9d9d9"/><text x="171" y="290" text-anchor="start" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="400"><tspan x="171" dy="0">Choice A: an unsupported generalization</tspan></text><circle cx="150" cy="332" r="7" fill="#ffffff" stroke="#d9d9d9"/><text x="171" y="338" text-anchor="start" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="400"><tspan x="171" dy="0">Choice B: a claim grounded in the excerpt</tspan></text><circle cx="150" cy="380" r="7" fill="#ffffff" stroke="#d9d9d9"/><text x="171" y="386" text-anchor="start" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="400"><tspan x="171" dy="0">Choice C: an unrelated statement</tspan></text><rect x="140" y="428" width="190" height="48" rx="5" fill="#f9f9f9" stroke="#d9d9d9" /><text x="235" y="459" text-anchor="middle" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" font-weight="400"><tspan x="235" dy="0">Submit answer</tspan></text><text x="520" y="458" text-anchor="start" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400"><tspan x="520" dy="0">View source →</tspan></text><path d="M761 145H795" fill="none" stroke="#838383" stroke-width="1.5"   /><text x="811" y="151" text-anchor="start" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="600"><tspan x="811" dy="0">1  Orient</tspan></text><path d="M761 284H795" fill="none" stroke="#838383" stroke-width="1.5"   /><text x="811" y="290" text-anchor="start" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="600"><tspan x="811" dy="0">2  Answer</tspan></text><path d="M761 453H795" fill="none" stroke="#838383" stroke-width="1.5"   /><text x="811" y="459" text-anchor="start" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="600"><tspan x="811" dy="0">3  Continue</tspan></text><text x="140" y="553" text-anchor="start" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="400"><tspan x="140" dy="0">After submission: feedback and explanation appear below the question.</tspan></text></svg>