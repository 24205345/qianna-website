<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="550" viewBox="0 0 1040 550" role="img" aria-labelledby="title desc"><title id="title">One task, four interface moments</title><desc id="desc">Views follow the task; they need not become four separate URLs.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#838383"/></marker><marker id="arrow-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M9 1L1 5L9 9Z" fill="#838383"/></marker></defs><rect width="1040" height="550" fill="#ffffff"/><text x="24" y="36" text-anchor="start" fill="#202020" font-family="Georgia, SimSun, serif" font-size="24" font-weight="400"><tspan x="24" dy="0">One task, four interface moments</tspan></text><text x="24" y="68" text-anchor="start" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400"><tspan x="24" dy="0">Start from what the person is trying to finish.</tspan></text><circle cx="125" cy="156" r="27" fill="#f9f9f9" stroke="#d9d9d9"/><svg x="111" y="142" xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#202020" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-file-input" aria-hidden="true"><path d="M4 11V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.706.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-1"></path><path d="M14 2v5a1 1 0 0 0 1 1h5"></path><path d="M2 15h10"></path><path d="m9 18 3-3-3-3"></path></svg><text x="125" y="216" text-anchor="middle" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19" font-weight="600"><tspan x="125" dy="0">Provide material</tspan></text><text x="125" y="247" text-anchor="middle" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400"><tspan x="125" dy="0">Paste text / upload</tspan></text><path d="M165 156H348" fill="none" stroke="#838383" stroke-width="1.5"  marker-end="url(#arrow)" /><circle cx="388" cy="156" r="27" fill="#f9f9f9" stroke="#d9d9d9"/><svg x="374" y="142" xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#202020" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-workflow" aria-hidden="true"><rect width="8" height="8" x="3" y="3" rx="2"></rect><path d="M7 11v4a2 2 0 0 0 2 2h4"></path><rect width="8" height="8" x="13" y="13" rx="2"></rect></svg><text x="388" y="216" text-anchor="middle" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19" font-weight="600"><tspan x="388" dy="0">Generate practice</tspan></text><text x="388" y="247" text-anchor="middle" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400"><tspan x="388" dy="0">Status and cancellation</tspan></text><path d="M428 156H611" fill="none" stroke="#838383" stroke-width="1.5"  marker-end="url(#arrow)" /><circle cx="651" cy="156" r="27" fill="#f9f9f9" stroke="#d9d9d9"/><svg x="637" y="142" xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#202020" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-list-checks" aria-hidden="true"><path d="M13 5h8"></path><path d="M13 12h8"></path><path d="M13 19h8"></path><path d="m3 17 2 2 4-4"></path><path d="m3 7 2 2 4-4"></path></svg><text x="651" y="216" text-anchor="middle" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19" font-weight="600"><tspan x="651" dy="0">Answer questions</tspan></text><text x="651" y="247" text-anchor="middle" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400"><tspan x="651" dy="0">Keep the current draft</tspan></text><path d="M691 156H874" fill="none" stroke="#838383" stroke-width="1.5"  marker-end="url(#arrow)" /><circle cx="914" cy="156" r="27" fill="#f9f9f9" stroke="#d9d9d9"/><svg x="900" y="142" xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#202020" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-book-open-check" aria-hidden="true"><path d="M12 5v16"></path><path d="m16 12 2 2 4-4"></path><path d="M22 6V5a2 2 0 00-1.999-2L16 3.002A5 5 0 0012 5a5 5 0 00-4-2H4a2 2 0 00-2 2v12a2 2 0 001.999 2H8a5 5 0 014 2 5 5 0 014-2h4.001A2 2 0 0022 17v-1.344"></path></svg><text x="914" y="216" text-anchor="middle" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19" font-weight="600"><tspan x="914" dy="0">Review feedback</tspan></text><text x="914" y="247" text-anchor="middle" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400"><tspan x="914" dy="0">Explain after submission</tspan></text><path d="M388 274V315H125V357" fill="none" stroke="#838383" stroke-width="1.5"  marker-end="url(#arrow)" /><text x="180" y="305" text-anchor="start" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" font-weight="400"><tspan x="180" dy="0">Failure</tspan></text><rect x="30" y="358" width="245" height="74" rx="4" fill="#f9f9f9" stroke="#d9d9d9" /><text x="152" y="403" text-anchor="middle" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" font-weight="400"><tspan x="152" dy="0">Keep input and retry</tspan></text><path d="M914 274V315H651V357" fill="none" stroke="#838383" stroke-width="1.5"  marker-end="url(#arrow)" /><rect x="528" y="358" width="245" height="74" rx="4" fill="#f9f9f9" stroke="#d9d9d9" /><text x="650" y="403" text-anchor="middle" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" font-weight="400"><tspan x="650" dy="0">Inspect source</tspan></text><path d="M773 395H805V275H680" fill="none" stroke="#838383" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)" /><path d="M24 475L1016 475" fill="none" stroke="#d9d9d9" stroke-width="1.4" /><text x="24" y="504" text-anchor="start" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400"><tspan x="24" dy="0">Generation failure keeps the material; source review returns to the same answer.</tspan></text></svg>