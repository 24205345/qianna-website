<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="734" viewBox="0 0 1040 734" role="img" aria-labelledby="title desc"><title id="title">Long videos: parallel segments, ordered evidence</title><desc id="desc">Valid captions take a shorter path. Resume segments independently; publish the full overview after coverage checks.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#838383"/></marker><marker id="arrow-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M9 1L1 5L9 9Z" fill="#838383"/></marker></defs><rect width="1040" height="734" fill="#ffffff"/><text x="24" y="36" text-anchor="start" fill="#202020" font-family="Georgia, SimSun, serif" font-size="24" font-weight="400"><tspan x="24" dy="0">Long videos: parallel segments, ordered evidence</tspan></text><text x="24" y="68" text-anchor="start" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400"><tspan x="24" dy="0">An ASR path with a caption shortcut; segment count and timing are illustrative.</tspan></text><circle cx="130" cy="174" r="28" fill="#f9f9f9" stroke="#d9d9d9"/><svg x="115" y="159" xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#202020" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-clapperboard" aria-hidden="true"><path d="m12.296 3.464 3.02 3.956"></path><path d="M20.2 6 3 11l-.9-2.4c-.3-1.1.3-2.2 1.3-2.5l13.5-4c1.1-.3 2.2.3 2.5 1.3z"></path><path d="M3 11h18v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><path d="m6.18 5.276 3.1 3.899"></path></svg><text x="130" y="232" text-anchor="middle" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="600"><tspan x="130" dy="0">Authorized source</tspan></text><text x="130" y="262" text-anchor="middle" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" font-weight="400"><tspan x="130" dy="0">Metadata + access checks</tspan></text><circle cx="440" cy="174" r="28" fill="#f9f9f9" stroke="#d9d9d9"/><svg x="425" y="159" xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#202020" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-scissors" aria-hidden="true"><circle cx="6" cy="6" r="3"></circle><path d="M8.12 8.12 12 12"></path><path d="M20 4 8.12 15.88"></path><circle cx="6" cy="18" r="3"></circle><path d="M14.8 14.8 20 20"></path></svg><text x="440" y="232" text-anchor="middle" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="600"><tspan x="440" dy="0">Audio segmentation</tspan></text><text x="440" y="262" text-anchor="middle" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" font-weight="400"><tspan x="440" dy="0">Speech boundaries + offsets</tspan></text><path d="M177 174H393" fill="none" stroke="#838383" stroke-width="1.5"  marker-end="url(#arrow)" /><text x="823" y="124" text-anchor="middle" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="600"><tspan x="823" dy="0">Speech-to-text (ASR)</tspan></text><rect x="718" y="154" width="216" height="44" rx="4" fill="#f9f9f9" stroke="#d9d9d9" /><text x="826" y="182" text-anchor="middle" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="400"><tspan x="826" dy="0">Segment A</tspan></text><path d="M647 174V176H710" fill="none" stroke="#838383" stroke-width="1.5"  marker-end="url(#arrow)" /><path d="M942 176H980V366" fill="none" stroke="#838383" stroke-width="1.5"   /><rect x="718" y="216" width="216" height="44" rx="4" fill="#f9f9f9" stroke="#d9d9d9" /><text x="826" y="244" text-anchor="middle" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="400"><tspan x="826" dy="0">Segment B</tspan></text><path d="M647 174V238H710" fill="none" stroke="#838383" stroke-width="1.5"  marker-end="url(#arrow)" /><path d="M942 238H980V366" fill="none" stroke="#838383" stroke-width="1.5"   /><rect x="718" y="278" width="216" height="44" rx="4" fill="#f9f9f9" stroke="#d9d9d9" /><text x="826" y="306" text-anchor="middle" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="400"><tspan x="826" dy="0">Other segments</tspan></text><path d="M647 174V300H710" fill="none" stroke="#838383" stroke-width="1.5"  marker-end="url(#arrow)" /><path d="M942 300H980V366" fill="none" stroke="#838383" stroke-width="1.5"   /><path d="M486 174H647" fill="none" stroke="#838383" stroke-width="1.5"   /><text x="824" y="349" text-anchor="middle" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" font-weight="400"><tspan x="824" dy="0">Limit how many run together</tspan></text><path d="M980 366V407H800V453" fill="none" stroke="#838383" stroke-width="1.5"  marker-end="url(#arrow)" /><path d="M130 287V407H800" fill="none" stroke="#838383" stroke-width="1.5" stroke-dasharray="5 5"  /><text x="325" y="392" text-anchor="start" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400"><tspan x="325" dy="0">Validated captions skip ASR</tspan></text><svg x="785" y="473" xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#202020" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-list-ordered" aria-hidden="true"><path d="M11 5h10"></path><path d="M11 12h10"></path><path d="M11 19h10"></path><path d="M4 4h1v5"></path><path d="M4 9h2"></path><path d="M6.5 20H3.4c0-1 2.6-1.925 2.6-3.5a1.5 1.5 0 0 0-2.6-1.02"></path></svg><text x="800" y="539" text-anchor="middle" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="600"><tspan x="800" dy="0">Align evidence</tspan></text><text x="800" y="569" text-anchor="middle" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" font-weight="400"><tspan x="800" dy="0">Keep timestamps · remove overlap</tspan></text><svg x="455" y="473" xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#202020" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-book-open" aria-hidden="true"><path d="M12 5v16"></path><path d="M20.001 19A2 2 0 0022 17V5a2 2 0 00-1.999-2L16 3.002A5 5 0 0012 5a5 5 0 00-4-2H4a2 2 0 00-2 2v12a2 2 0 001.999 2H8a5 5 0 014 2 5 5 0 014-2z"></path></svg><text x="470" y="539" text-anchor="middle" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="600"><tspan x="470" dy="0">Facts and chapters</tspan></text><text x="470" y="569" text-anchor="middle" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" font-weight="400"><tspan x="470" dy="0">Group by meaning · cite sources</tspan></text><svg x="115" y="473" xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#202020" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-file-check-corner lucide-file-check-2" aria-hidden="true"><path d="M10.5 22H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.706.706l3.588 3.588A2.4 2.4 0 0 1 20 8v6"></path><path d="M14 2v5a1 1 0 0 0 1 1h5"></path><path d="m14 20 2 2 4-4"></path></svg><text x="130" y="539" text-anchor="middle" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="600"><tspan x="130" dy="0">Full overview</tspan></text><text x="130" y="569" text-anchor="middle" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="14" font-weight="400"><tspan x="130" dy="0">Check coverage + source</tspan><tspan x="130" dy="20.3">support</tspan></text><path d="M750 489H521" fill="none" stroke="#838383" stroke-width="1.5"  marker-end="url(#arrow)" /><path d="M418 489H181" fill="none" stroke="#838383" stroke-width="1.5"  marker-end="url(#arrow)" /><text x="24" y="621" text-anchor="start" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400"><tspan x="24" dy="0">Persist each segment; retry only failed work. Concurrency is tuned, not fixed by this illustration.</tspan></text><path d="M24 659L1016 659" fill="none" stroke="#d9d9d9" stroke-width="1.4" /><text x="24" y="688" text-anchor="start" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400"><tspan x="24" dy="0">Show evidenced partial results early. Final output needs required intervals or explicit missing-coverage labels.</tspan></text></svg>