<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="726" viewBox="0 0 1040 726" role="img" aria-labelledby="title desc"><title id="title">The contract includes the failure path</title><desc id="desc">Illustrative synchronous flow. A timeout ends the wait; it does not prove upstream work has stopped.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M1 1L9 5L1 9Z" fill="#838383"/></marker><marker id="arrow-start" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M9 1L1 5L9 9Z" fill="#838383"/></marker></defs><rect width="1040" height="726" fill="#ffffff"/><text x="24" y="36" text-anchor="start" fill="#202020" font-family="Georgia, SimSun, serif" font-size="24" font-weight="400"><tspan x="24" dy="0">The contract includes the failure path</tspan></text><text x="24" y="68" text-anchor="start" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400"><tspan x="24" dy="0">Synchronous example: success and failure are alternative outcomes.</tspan></text><svg x="131" y="111" xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#202020" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-monitor" aria-hidden="true"><rect width="20" height="14" x="2" y="3" rx="2"></rect><line x1="8" x2="16" y1="21" y2="21"></line><line x1="12" x2="12" y1="17" y2="21"></line></svg><text x="145" y="169" text-anchor="middle" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="600"><tspan x="145" dy="0">Client</tspan></text><svg x="506" y="111" xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#202020" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-shield-check" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"></path><path d="m9 12 2 2 4-4"></path></svg><text x="520" y="169" text-anchor="middle" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="600"><tspan x="520" dy="0">Application server</tspan></text><svg x="896" y="111" xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#202020" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-cloud" aria-hidden="true"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"></path></svg><text x="910" y="169" text-anchor="middle" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="18" font-weight="600"><tspan x="910" dy="0">Generator</tspan></text><rect x="24" y="344" width="992" height="144" rx="4" fill="#f9f9f9" stroke="#d9d9d9" /><rect x="24" y="506" width="992" height="117" rx="4" fill="none" stroke="#d9d9d9" /><path d="M145 187V635" fill="none" stroke="#d9d9d9" stroke-width="1.5" stroke-dasharray="5 5"  /><path d="M520 187V635" fill="none" stroke="#d9d9d9" stroke-width="1.5" stroke-dasharray="5 5"  /><path d="M910 187V635" fill="none" stroke="#d9d9d9" stroke-width="1.5" stroke-dasharray="5 5"  /><path d="M149 222H516" fill="none" stroke="#838383" stroke-width="1.5"  marker-end="url(#arrow)" /><text x="190" y="208" text-anchor="start" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="400"><tspan x="190" dy="0">Submit material</tspan></text><path d="M520 245H552V274H520" fill="none" stroke="#838383" stroke-width="1.5"  marker-end="url(#arrow)" /><text x="568" y="267" text-anchor="start" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400"><tspan x="568" dy="0">Validate input + access</tspan></text><path d="M524 316H906" fill="none" stroke="#838383" stroke-width="1.5"  marker-end="url(#arrow)" /><text x="568" y="302" text-anchor="start" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="400"><tspan x="568" dy="0">Request generation</tspan></text><text x="39" y="371" text-anchor="start" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="600"><tspan x="39" dy="0">Success</tspan></text><path d="M906 385H524" fill="none" stroke="#838383" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)" /><text x="568" y="373" text-anchor="start" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="400"><tspan x="568" dy="0">Candidate output</tspan></text><text x="542" y="418" text-anchor="start" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400"><tspan x="542" dy="0">Check structure + content</tspan></text><path d="M516 458H149" fill="none" stroke="#838383" stroke-width="1.5"  marker-end="url(#arrow)" /><text x="190" y="446" text-anchor="start" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="400"><tspan x="190" dy="0">Return the checked exercise</tspan></text><text x="39" y="535" text-anchor="start" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="600"><tspan x="39" dy="0">Failure /</tspan><tspan x="39" dy="21.75">timeout</tspan></text><path d="M516 551H149" fill="none" stroke="#838383" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#arrow)" /><text x="190" y="538" text-anchor="start" fill="#202020" font-family="Arial, Microsoft YaHei, sans-serif" font-size="16" font-weight="400"><tspan x="190" dy="0">Stable error + retry policy</tspan></text><text x="174" y="595" text-anchor="start" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400"><tspan x="174" dy="0">Keep input; offer an explicit retry</tspan></text><path d="M24 651L1016 651" fill="none" stroke="#d9d9d9" stroke-width="1.4" /><text x="24" y="680" text-anchor="start" fill="#646464" font-family="Arial, Microsoft YaHei, sans-serif" font-size="15" font-weight="400"><tspan x="24" dy="0">A timeout ends this wait; it does not establish that upstream work has been cancelled.</tspan></text></svg>