</head><body><main class="wrap">
<header class="page-header"><div><h1 id="title">The interface lab.</h1><p id="intro">Start by naming the parts of a page. Then try a change and put what you want into words.</p></div></header>
<div class="sub-rail"><div id="groups" class="groups" role="group" aria-label="Topics"></div></div>
<div class="layout">
<aside class="catalog"><p class="catalog-label" id="catalog-label">What would you like to change?</p><nav id="navigation" aria-label="Examples"></nav></aside>
<section class="preview" aria-label="Example preview"><div id="controls" class="controls"></div><div class="toolbar"><label><span id="duration-label">Transition</span><input id="duration" type="range" min="80" max="800" step="20" value="240"><output id="duration-value" for="duration">240 ms</output></label><label><input id="reduce" type="checkbox"><span id="reduce-label">Reduce motion</span></label><small id="motion-note"></small></div><div id="canvas" class="canvas"></div></section>
<aside class="description" aria-labelledby="selected-name"><div id="studio-tabs" class="studio-tabs" role="tablist" hidden></div><section id="studio-style" role="tabpanel" hidden></section><section id="studio-brief" role="tabpanel" hidden></section><div id="studio-parts"><div class="meaning" aria-live="polite" aria-atomic="true"><h2 id="selected-name"></h2><p id="plain"></p><p id="everyday"></p></div><div class="sentence"><p id="sentence-label" class="area-label"></p><p id="result-sentence" aria-live="polite" aria-atomic="true"></p></div><div class="copy-row"><button id="copy" type="button"></button><span id="copy-status" role="status"></span></div><details class="rule-details"><summary id="rules-label"></summary><ul id="facts" class="facts"></ul></details><details id="prompt-details" class="prompt-details"><summary id="prompt-label"></summary><textarea id="prompt" class="prompt" readonly spellcheck="false" aria-labelledby="prompt-label"></textarea></details></div></aside>
</div>
<noscript><p lang="zh-CN">本页通过布局、排版、动效和组件示例帮助描述界面。请说明结构、对象、触发、变化与结束规则；交互示例需要 JavaScript。</p><p lang="en">Describe the structure, object, trigger, visible change and completion rules. These layout, typography, motion and component examples need JavaScript.</p></noscript>
</main><dialog id="dialog" aria-labelledby="dialog-title"><h2 id="dialog-title"></h2><p id="dialog-info"></p><label><span id="dialog-label"></span><input id="draft" maxlength="120"></label><button id="close-dialog" type="button" autofocus></button></dialog>
<dialog id="studio-project-dialog" aria-labelledby="studio-project-title"><h2 id="studio-project-title"></h2><p id="studio-project-info"></p><button id="studio-project-close" type="button"></button></dialog>
<script>'use strict';
const $=id=>document.getElementById(id);
const groups=[{id:'basics',en:'Know the page',zh:'认识页面',items:['anatomy']},{id:'layout',en:'Arrange content',zh:'安排布局',items:['grid','workspace','footer']},{id:'type',en:'Style the text',zh:'调整文字',items:['typography','rhythm']},{id:'motion',en:'Add motion',zh:'体验动效',items:['scroll','transition']},{id:'components',en:'Try components',zh:'操作组件',items:['cta','button','card','input','tabs','accordion','overlay','feedback','ai']}];
const ids=groups.flatMap(g=>g.items);
const groupFor=id=>groups.find(g=>g.items.includes(id));
const params=new URLSearchParams(location.search);
const lang=params.get('lang')==='zh'?'zh':'en';
let current=ids.includes(params.get('demo'))?params.get('demo'):'anatomy';
let selectedPart='title';
let duration=240,reduce=false,timer=null,observer=null,previewObserver=null,step=0,paused=false,canceled=false,failed=false,tab=0,returnFocus=null;
const media=matchMedia('(prefers-reduced-motion: reduce)');
const configs={cta:'priority',footer:'grouped',grid:'editorial',workspace:'desktop',typography:'serif',rhythm:'comfortable',scroll:'slide',transition:'fade',button:'default',card:'4',input:'blur',tabs:'0',accordion:'single',overlay:'modal',feedback:'inline',ai:'stream'};
const T=(en,zh)=>lang==='zh'?zh:en;
const labels={cta:['Call to action','行动入口'],footer:['Footer links','页脚链接'],anatomy:['Anatomy of a page','页面的组成'],grid:['Editorial grid','内容网格'],workspace:['Split workspace','分屏工作区'],typography:['Type hierarchy','文字层级'],rhythm:['Reading rhythm','阅读节奏'],scroll:['Scroll & reveal','滚动与进入'],transition:['View transitions','视图切换'],button:['Button','按钮'],card:['Card','卡片'],input:['Input','输入框'],tabs:['Tabs','标签页'],accordion:['Accordion','折叠面板'],overlay:['Modal & drawer','弹窗与抽屉'],feedback:['Feedback','操作反馈'],ai:['AI results','AI 结果']};
const names=id=>T(...labels[id]);
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const option=(value,en,zh)=>`<option value="${value}" ${configs[current]===value?'selected':''}>${escape(T(en,zh))}</option>`;
const action=(id,en,zh,disabled=false)=>`<button type="button" data-action="${id}" ${disabled?'disabled':''}>${escape(T(en,zh))}</button>`;
function stop(){if(timer!==null){clearInterval(timer);clearTimeout(timer);timer=null}if(observer){observer.disconnect();observer=null}if(previewObserver){previewObserver.disconnect();previewObserver=null}}
function url(){const q=new URLSearchParams({lang,demo:current});history.replaceState(null,'',location.pathname+'?'+q)}
function motion(){document.documentElement.classList.toggle('reduced',reduce||media.matches);document.documentElement.style.setProperty('--duration',duration+'ms');$('motion-note').textContent=media.matches?T('Your system requests reduced motion.','系统已启用减少动态效果。'):T('Example timings, not task completion times.','这里调整的是过渡时长，不是任务处理速度。')}
// Page-scale examples share the same language, motion and requirement system as components.
function studyDetails(){
 const mode=configs[current];
 const grid=T({editorial:'an asymmetric lead story and secondary column',equal:'two equal columns',stack:'a single reading column'}[mode],{editorial:'主次不对称的双栏',equal:'等宽双栏',stack:'单栏阅读'}[mode]);
 return {
  grid:[T('Grid layout defines which story leads and which details support it.','网格布局决定先看到什么，以及主次信息如何分配空间。'),T('Open the page or resize the available viewport.','打开页面，或改变可用宽度。'),T(`Use ${grid}, with a 24 px gap and a shared left edge. Prioritize the lead heading and its introduction.`,`采用${grid}，栏间距 24 px，内容左对齐；优先呈现主标题和导语。`),T('Collapse into source order on a narrow screen. Do not clip long titles or rearrange reading order only for appearance.','窄屏按内容顺序合为单栏；长标题换行，不为外观打乱阅读顺序。')],
  workspace:[T('A workspace keeps the main task and its reference close together.','工作区把主要任务和参考内容放在一起，减少来回查找。'),T('Switch the preview between desktop and mobile; open the source if needed.','切换桌面与手机预览，按需查看材料。'),T('Use a 3:2 split on desktop. On mobile, keep the question first and reveal the source below its entry.','桌面约按 3:2 分配题目与材料；手机优先呈现题目，在查看入口下展开材料。'),T('Retain the chosen answer when the viewport or source visibility changes. Closing the reference must not submit the answer.','切换尺寸、展开或关闭材料时保留选项；关闭参考内容不能触发提交。')],
  typography:[T('Type hierarchy uses family, size and weight to show what matters.','文字层级通过字体、字号和字重表达主次。'),T('Read the same article with a different heading style or type scale.','为同一篇文章切换标题字体或字号层级。'),T(`Use ${mode==='sans'?'sans-serif headings':'serif headings'} in a centered reading column. The heading scales up to ${mode==='large'?'44':'36'} px; body text is ${mode==='large'?'17':'15'} px. Keep notes smaller and quieter.`,`阅读栏居中，标题使用${mode==='sans'?'无衬线':'衬线'}字体，随可用宽度放大至 ${mode==='large'?'44':'36'} px；正文 ${mode==='large'?'17':'15'} px，注释稍小。`),T('These are preview sizes, not universal site tokens. Use the available reading width, wrap only when needed, and keep body text readable.','这些是预览参数，不是全站通用字号；充分使用阅读栏宽度，空间不足时自然换行，正文保持可读。')],
  rhythm:[T('Reading rhythm comes from line height, measure and space between ideas.','阅读节奏由行高、行长和段落之间的留白共同决定。'),T('Compare compact and comfortable settings using the same paragraph.','用同一段文字比较紧凑与舒展的排版。'),T(`Use ${mode==='compact'?'1.5 line height and 12 px paragraph gaps':'1.9 line height and 26 px paragraph gaps'}. Center the reading column, capped at ${lang==='zh'?(mode==='compact'?'36em':'28em'):(mode==='compact'?'72ch':'60ch')}, and align its headings and body.`,`采用${mode==='compact'?'1.5 倍行高、12 px 段间距':'1.9 倍行高、26 px 段间距'}；阅读栏居中，最大行宽 ${mode==='compact'?'36em':'28em'}，标题与正文左边线对齐。`),T('Preserve the text and hierarchy. Column limits are maximums, not fixed widths; they shrink to fit. Check Chinese and English separately.','保留文字与层级；行宽是上限而非固定值，窄屏自动缩小。中英文分别检查，不用空段落撑间距。')],
  scroll:[T('Scroll effects connect a page section appearing with the reader reaching it.','滚动动效把“读到这个位置”和“这段内容出现”联系起来。'),T('Scroll inside the preview until each section enters its viewport; Replay starts over.','在预览内部向下滚动，让章节进入可见区域；“重新体验”从头开始。'),T(`${mode==='slide'?'Fade in and move upward by 16 px':'Fade in without moving'} over ${duration} ms, once per section. Keep the small header fixed inside the preview. The thin line tracks reading position.`,`每个章节首次进入预览时，在 ${duration} ms 内${mode==='slide'?'从下方 16 px 淡入并上移':'原位淡入'}。顶部导航固定在预览内，细线表示阅读位置。`),T('Show all content when reduced motion is requested or observation is unavailable. Never hide required information indefinitely or animate every scroll pixel.','减少动态效果或不支持观察器时直接展示全文；不能让必要信息一直隐藏，也不逐像素跟随滚动抖动。')],
  transition:[T('A view transition explains that related content changed in place.','视图过渡帮助用户理解：内容在原位切换了。'),T('Activate Overview or Notes inside the preview.','点击预览中的“概览”或“笔记”。'),T(`Replace the content in place with ${mode==='slide'?'a 12 px upward fade':'an opacity fade'} lasting ${duration} ms. Keep the navigation and outer frame still.`,`在 ${duration} ms 内用${mode==='slide'?'从下方 12 px 上移并淡入':'透明度淡入'}替换正文，导航和外层框架保持稳定。`),T('Leave focus on the activated navigation button, mark the current view, and skip motion when requested. This local demo does not change the browser route.','焦点留在触发按钮上，标明当前视图；减少动态效果时直接切换。本地演示不修改浏览器路由。')]
 }[current];
}
function studyOptions(label,options,extra=''){
 return `<label>${escape(label)}<select id="config">${options.map(x=>option(...x)).join('')}</select></label>${extra}`;
}
function miniTop(){return `<div class="mini-topline"><span class="mini-brand">${T('Learning notes','学习笔记')}</span><span>${T('Practice / Review','练习 / 回顾')}</span></div>`}
function miniArticle(){return `<div class="mini-kicker">${T('A field note · Learning','实践笔记 · 学习')}</div><h3 class="mini-title">${T('Read for understanding. Return for evidence.','读懂一个观点，回到它的依据。')}</h3><p class="mini-deck">${T('A small practice session turns collected material into questions worth returning to.','把收集的材料变成值得回答的问题，在练习中发现还不理解的部分。')}</p>`}
function miniEvidence(){return `<div class="mini-evidence"><span>${T('From the source','摘自材料')}</span><blockquote>${T('“Evidence gives a reader a way to check a statement.”','“证据让读者能够核对一个说法。”')}</blockquote><p>${T('Read the claim. Find its support. Write your own question.','读到观点 → 找到依据 → 留下自己的问题')}</p></div>`}
function readingBody(){return `<div class="reading-body"><p>${T('A useful summary helps you find the main idea. A useful practice session goes further: it asks you to explain the idea and return to the part of the source that supports it.','一份有用的总结帮助你找到主要观点。一次有用的练习更进一步：让你解释这个观点，并回到材料中找到支持它的部分。')}</p><h3>${T('Leave room to think','为思考留一点空间')}</h3><p>${T('Keep the question and its choices together. Introduce supporting detail only when it is needed, and preserve the answer when the reader opens the source.','把题目与选项放在一起。需要时再展开补充内容；读者打开材料查看依据时，保留已经选择的答案。')}</p><p class="reading-note">${T('A shorter line and a little space can make relationships easier to see. Validate the choice with actual content.','适当的行宽和留白有助于看清内容之间的关系；仍需用真实文字检查是否合适。')}</p></div>`}
function renderStudy(){
 let html='',controls='';const mode=configs[current];
 if(current==='grid'){
  html=`<div class="mini-page">${miniTop()}<div class="mini-grid ${mode==='equal'?'equal':mode==='stack'?'stack':''}" id="layout-grid"><article>${miniArticle()}${miniEvidence()}<p class="mini-meta">${T('Main story · 5 questions','主要内容 · 5 道问题')}</p></article><article class="mini-secondary"><p class="mini-kicker">${T('On the side','延伸阅读')}</p><h3>${T('A question to keep','留一个问题')}</h3><p>${T('Which part of the material changed your original understanding?','材料中的哪一部分改变了你原来的理解？')}</p><p class="mini-meta">${T('Secondary detail','次要内容')}</p></article></div></div>`;
  controls=studyOptions(T('Column relationship','分栏关系'),[['editorial','Lead + secondary','主次双栏'],['equal','Equal columns','等宽双栏'],['stack','Single column','单栏']]);
 }else if(current==='workspace'){
  html=`<div class="frame-controls"><span>${T('Preview viewport','预览视口')}</span><output id="frame-mode">${T(mode==='mobile'?'Mobile · up to 390 px wide · scroll inside':'Desktop · adapts to available width',mode==='mobile'?'手机 · 最大宽度 390 px · 内部可滚动':'桌面 · 随可用宽度调整')}</output></div><div class="viewport-stage"><div id="study-frame" class="study-frame ${mode==='mobile'?'mobile':''}" tabindex="0" role="region" aria-label="${T('Scrollable workspace preview','可滚动的工作区预览')}"><div class="mini-workspace"><article class="mini-question"><p class="hint">${T('Question 2 of 5','第 2 / 5 题')}</p><h3>${T('What makes a claim trustworthy?','什么让一个观点值得相信？')}</h3><div class="mini-options"><label><input type="radio" name="study-answer" value="a"><span>${T('It appears repeatedly.','它被重复提及。')}</span></label><label><input type="radio" name="study-answer" value="b"><span>${T('It can be checked against evidence.','它可以根据证据核对。')}</span></label></div>${action('study-submit','Check answer','核对答案')} <button type="button" id="source-toggle" class="mini-source-toggle" aria-expanded="false" aria-controls="workspace-source">${T('View source','查看材料')}</button><p id="workspace-feedback" class="hint" role="status" style="margin-top:12px"></p></article><aside id="workspace-source" class="mini-source" data-open="false" ${mode==='mobile'?'hidden':''}><h3>${T('Source material','参考材料')}</h3><p>${T('Evidence gives a reader a way to check a statement. Repetition alone does not establish whether it is accurate.','证据让读者能够核对一个说法。仅凭重复出现，并不能判断这个说法是否准确。')}</p></aside></div></div></div>`;
  controls=studyOptions(T('Preview viewport','预览尺寸'),[['desktop','Desktop','桌面'],['mobile','Mobile','手机']]);
 }else if(current==='typography'||current==='rhythm'){
  html=`<article class="mini-reading ${current==='typography'&&mode==='sans'?'sans':''} ${current==='typography'&&mode==='large'?'large-type':''}" id="reading-study" ${current==='rhythm'?`style="--study-leading:${mode==='compact'?'1.5':'1.9'};--study-space:${mode==='compact'?'12':'26'}px;--study-measure:${lang==='zh'?(mode==='compact'?'36em':'28em'):(mode==='compact'?'72ch':'60ch')}"`:''}>${miniTop()}<div class="reading-column">${miniArticle()}${readingBody()}</div></article>`;
  controls=current==='typography'?studyOptions(T('Heading treatment','标题层次'),[['serif','Serif headings','衬线标题'],['sans','Sans-serif headings','无衬线标题'],['large','Larger contrast','更大的字号对比']]):studyOptions(T('Reading density','阅读密度'),[['comfortable','Comfortable','舒展'],['compact','Compact','紧凑']]);
 }else if(current==='scroll'){
  html=`<div class="preview-scroll" id="scroll-study" data-effect="${mode}" tabindex="0" role="region" aria-label="${T('Scrollable page preview','可滚动的页面预览')}"><div class="scroll-header"><span>${T('Learning journal','学习札记')}</span><div class="scroll-progress" aria-hidden="true"><span id="reading-progress"></span></div></div>${[0,1,2].map((n)=>`<section class="scroll-section"><div class="reveal-item"><span class="mini-kicker">${T(['Start with a question','Find the evidence','Return to practice'][n],['从一个问题开始','找到材料中的依据','回到练习'][n])}</span><h3>${T(['What do you want to understand?','Keep the source within reach.','A useful next step.'][n],['你想理解什么？','让原文触手可及。','留下有用的下一步。'][n])}</h3><p>${T(['Before collecting more material, write down one thing you would like to explain in your own words.','Compare the explanation with its source. Which sentence supports the claim, and what remains uncertain?','Turn the question into a small practice task. Keep your answer so that you can compare it with your next attempt.'][n],['在继续收集材料前，先记下一个你想用自己的话解释清楚的问题。','把解释与原文对照。哪句话支持了这个观点？还有哪些部分不能确定？','把问题变成一个小练习，留下这次的回答，方便与下一次的理解对照。'][n])}</p>${miniEvidence()}</div></section>`).join('')}</div>`;
  controls=studyOptions(T('Entry effect','进入效果'),[['fade','Fade only','原位淡入'],['slide','Fade + upward movement','淡入并上移']],action('study-replay','Replay','重新体验'));
 }else if(current==='transition'){

function mountStudy(){
 if(previewObserver){previewObserver.disconnect();previewObserver=null}
 if(current==='transition'&&(reduce||media.matches))$('switch-view').className='switch-view';
 if(current==='workspace'&&'ResizeObserver' in window){
  const frame=$('study-frame');
  const active=new ResizeObserver(()=>{
   if(previewObserver!==active||!frame.isConnected)return;
   const w=frame.clientWidth,h=frame.clientHeight;
   $('workspace-source').hidden=(configs.workspace==='mobile'||w<=560)&&$('source-toggle').getAttribute('aria-expanded')!=='true';
   $('frame-mode').textContent=T(`${configs.workspace==='mobile'?'Mobile':'Desktop'} · ${w} × ${h} px · scroll inside`,`${configs.workspace==='mobile'?'手机':'桌面'} · ${w} × ${h} px · 内部可滚动`);
  });
  previewObserver=active;active.observe(frame);
 }
 if(current!=='scroll')return;
 const region=$('scroll-study'),items=[...region.querySelectorAll('.reveal-item')];
 if(observer){observer.disconnect();observer=null}
 const reduced=reduce||media.matches;
 if(reduced||!('IntersectionObserver' in window)){region.classList.remove('has-observer');items.forEach(el=>el.classList.add('in-view'))}
 else{
  region.classList.add('has-observer');items.forEach(el=>el.classList.remove('in-view'));
  const activeObserver=new IntersectionObserver(entries=>{if(observer!==activeObserver)return;for(const e of entries)if(e.isIntersecting){e.target.classList.add('in-view');activeObserver.unobserve(e.target)}},{root:region,threshold:.15});
  observer=activeObserver;
  items.forEach(el=>observer.observe(el));
 }
 function progress(){const total=region.scrollHeight-region.clientHeight;$('reading-progress').style.width=(total>0?Math.min(100,Math.max(0,region.scrollTop/total*100)):0)+'%'}
 region.onscroll=progress;progress();
}

function simpleRequest(){
 const mode=configs[current];
 const requests={
  cta:()=>T(configs.cta==='generic'?'Use “Continue” and “Try” with equal emphasis. Check whether readers can predict the two actions.':configs.cta==='clear'?'Use explicit labels “Generate practice” and “Use sample”. Keep their appearance equal while comparing wording.':'Make “Generate practice” the main action after the material field. Keep “Use sample” secondary. Show validation and completion near the actions, preserving material when the presentation changes.',configs.cta==='generic'?'两个入口用同样样式，分别写“继续”和“试一下”；检查读者能否判断点击后发生什么。':configs.cta==='clear'?'把两个入口明确写为“生成练习”和“使用示例”；先保持相同样式，只比较文字是否清楚。':'材料输入区后突出“生成练习”，“使用示例”作为次要操作；校验与完成提示放在操作附近，切换呈现时保留材料。'),
  footer:()=>T(configs.footer==='flat'?'Place the four supporting links in a wrapping row after the content, separated by a fine rule. Keep the footer in normal flow.':'Group the footer links under “Keep learning” and “About the tool”. Stack groups on a narrow screen and keep the footer after the content without covering it.',configs.footer==='flat'?'在正文之后用细线分隔页脚，四个补充链接横向平铺、空间不足时换行；页脚随内容自然排列。':'页脚链接分成“继续学习”和“了解工具”两组；窄屏上下排列，始终位于内容之后，不覆盖正文。'),
  anatomy:()=>studioPartRequest(selectedPart),
  grid:()=>T({editorial:'Give the main story a wider left column and the supporting text a narrower right column. Keep 24 px between them; stack them on a phone.',equal:'Give the two pieces of content equal column widths with a 24 px gap. Stack them on a phone.',stack:'Put all content in one reading column, main story first and supporting text afterwards.'}[mode],{editorial:'我想让主要内容在左、占更大宽度，补充内容在右、窄一些；两栏间留 24 px，手机上改为上下排列。',equal:'我想让两份内容左右等宽，两栏间留 24 px；手机上改为上下排列。',stack:'我想把内容放在同一栏里，先展示主要内容，再展示补充内容。'}[mode]),
  workspace:()=>T('Keep the question and source side by side on desktop. On a phone, show the question first and let me expand the source without losing my answer.','电脑上题目和材料左右并排；手机上先看题目，按需展开材料，切换时保留已选答案。'),
  typography:()=>T(`Use ${mode==='sans'?'sans-serif':'serif'} headings, more prominent than the body text. ${mode==='large'?'Increase the heading/body size contrast.':'Keep notes smaller and quieter.'} Let long titles wrap.`,`标题用${mode==='sans'?'无衬线字体，笔画简洁':'衬线字体，笔画带有装饰性收笔'}，比正文更醒目；${mode==='large'?'进一步拉开标题与正文的字号差别':'注释再小一些、颜色浅一些'}，长标题自然换行。`),
  rhythm:()=>T(mode==='compact'?'Make the text compact: 1.5 line height and 12 px between paragraphs. Keep the wording.':'Give the text more breathing room: 1.9 line height and 26 px between paragraphs. Keep the wording.',mode==='compact'?'我想让阅读更紧凑：行高用字号的 1.5 倍，段落之间留 12 px，保留原文。':'我想让阅读更舒展：行高用字号的 1.9 倍，段落之间留 26 px，保留原文。'),
  scroll:()=>T(`As I scroll to a section, ${mode==='slide'?'fade it in from 16 px below':'fade it in without moving'} over ${duration} ms. Show it immediately when reduced motion is requested.`,`滚动读到一段内容时，让它在 ${duration} ms 内${mode==='slide'?'从下方 16 px 处逐渐出现并回到原位':'在原位逐渐出现'}，每段只播放一次；减少动态效果时直接显示。`),
  transition:()=>T(`When I switch views, ${mode==='slide'?'fade the new content in from 12 px below':'fade the new content in place'} over ${duration} ms. Keep navigation and focus steady.`,`切换内容时，让新内容在 ${duration} ms 内${mode==='slide'?'从下方 12 px 处上移并逐渐出现':'在原位逐渐出现'}；导航和外框不动，键盘焦点留在原按钮。`),
  button:()=>T('Show when the button is ready, focused, pressed, disabled or busy. A real click in Default should prevent duplicate clicks until the task ends.','按钮要让人看出能否点击、是否正在处理；默认模式点击后显示“正在生成”，完成前不能重复提交，结束后恢复。'),
  card:()=>T(`On hover, lift this item by ${mode} px over ${duration} ms and darken its border. Restore it on pointer leave; use an outline for keyboard focus.`,`鼠标放到卡片上时，在 ${duration} ms 内向上移动 ${mode} px，边框加深；移开后复原，键盘聚焦用轮廓提示。`),
  input:()=>T(`Check the title ${mode==='blur'?'when I leave the field and on submit':'on submit'}. Explain errors below the field and keep what I typed.`,`${mode==='blur'?'离开输入框或提交时':'提交时'}检查标题，填错后在输入框下说明怎么改，保留已经输入的文字。`),
  tabs:()=>T('Switch related content in the same area and underline the selected tab. Keep my draft when I switch back.','点击页签，在同一块区域切换内容，用底线标出当前项；切走再回来时保留草稿。'),
  accordion:()=>T(`Click a heading to reveal or hide its detail. ${mode==='single'?'Opening another should close the previous section.':'Allow several sections to stay open.'}`,`点击标题展开或收起详情；${mode==='single'?'打开另一项时，自动收起上一项':'允许同时展开多项'}。`),
  overlay:()=>T(`Open the source in ${mode==='drawer'?'a panel on the right':'a centered dialog'} over a dimmed background. Close with Esc or the close button, retain the note, and return focus.`,`点击后${mode==='drawer'?'从右边打开一个详情面板':'在屏幕中间打开弹窗'}，背景变暗；按 Esc 或关闭按钮退出，保留备注，键盘焦点回到打开按钮。`),
  feedback:()=>T(`Show a confirmation ${mode==='toast'?'floating near the bottom of the preview':'beside the action'}. Keep it until I dismiss it and do not move keyboard focus.`,`操作后${mode==='toast'?'在预览底部浮出一条提示':'在操作附近显示一条确认信息'}；提示不抢走键盘焦点，由用户手动关闭。`),
  ai:()=>T(`During processing, ${mode==='stream'?'show text as it arrives and mark it incomplete':'show named stages, then the final result'}. Allow pause, retry and cancel; clearly say what was retained.`,`处理时${mode==='stream'?'逐段显示文字，结束前标为部分结果':'先显示正在进行的步骤，完成后再显示全文'}；可以暂停、重试或取消，并明确哪些内容已保留。`)
 };
 return requests[current]();
}

function enhanceControls(){
 const select=$('config');if(!select)return;
 const label=select.closest('label'),legend=label.firstChild.textContent;
 label.hidden=true;
 const fieldset=document.createElement('fieldset');fieldset.className='config-choices';
 fieldset.innerHTML=`<legend>${escape(legend)}</legend><div>${[...select.options].map(o=>`<button type="button" data-config="${escape(o.value)}" aria-pressed="${o.selected}" aria-controls="canvas">${escape(o.textContent)}</button>`).join('')}</div>`;
 label.after(fieldset);
}

function studioBrief(){
 const reduced=reduce||media.matches;
 return T(`Build a responsive portfolio page using placeholder copy and original image placeholders. Follow the existing site's editorial style; do not invent project results or real client information.\n\nPage structure\nSite navigation → eyebrow, main heading and introduction → category rail → section navigation, project content and supporting information → footer.\n\nVisual choices\nLayout: ${studioName('layout')}. Heading: ${studioName('type')}; body: sans serif. Card corners: ${studio.radius} px. Content gaps: ${studio.space==='relaxed'?24:12} px. Use a neutral stone palette, fine dividers and a clear primary reading area.\n\nInteraction\nCategory filters update the project collection in place, retain the selected category and show its active state. Project actions open a detail dialog; closing it returns focus to the original action. Contact displays a local example message. ${studio.hover==='lift'&&!reduced?'On devices with a mouse, raise project cards by 4 px on hover over 240 ms.':'Use a border change for hover feedback without movement.'}\n\nResponsive and accessibility\nStack the hero, section navigation, projects and supporting information in reading order on narrow screens. Let long headings wrap. Keep every action accessible by keyboard and touch. Respect reduced motion; inspection overlays and teaching controls are not part of the finished page. Verify filtering, dialog focus, mobile layout and copying before delivery.`,`请制作一个响应式作品集页面，使用占位文案和原创占位图，沿用现有网站的杂志策展风格，不编造真实项目成果或客户信息。\n\n页面结构\n站点导航 → 眉标、主标题与导语 → 分类横轨 → 页内目录、项目内容与辅助信息 → 页脚。\n\n视觉设定\n版式：${studioName('layout')}。标题：${studioName('type')}；正文：无衬线。卡片圆角 ${studio.radius} px，内容间距 ${studio.space==='relaxed'?24:12} px。使用中性灰色系、细分隔线与明确的主次阅读区域。\n\n交互规则\n分类在原位筛选项目，保留当前选择并标出激活状态。点击项目打开详情弹窗，关闭后焦点回到原入口；联系入口显示本地示例提示。${studio.hover==='lift'&&!reduced?'有鼠标的设备上，卡片悬停时在 240 ms 内上移 4 px。':'悬停只改变边框，不播放位移。'}\n\n响应式与可访问性\n窄屏按阅读顺序堆叠首屏、目录、项目和辅助信息，长标题自然换行。操作支持键盘和触屏，尊重减少动态效果设置。认图边框与实验室控件不进入最终页面。交付前检查筛选、弹窗焦点、手机布局和复制结果。`);
}

function validate(submit=false){const input=$('sample-input'),valid=input.value.replace(/\s/g,'').length>=3;input.setAttribute('aria-invalid',String(!valid));$('input-error').textContent=valid?(submit?T('Valid in this simulation. Nothing was saved.','本地校验通过，没有保存数据。'):''):T('Enter at least 3 non-space characters.','请输入至少 3 个非空白字符。');if(submit&&!valid)input.focus();return valid}
function switchTab(n,focus){tab=n;for(let i=0;i<2;i++){const el=$('tab-'+i);el.setAttribute('aria-selected',String(i===n));el.tabIndex=i===n?0:-1;$('panel-'+i).hidden=i!==n;}if(focus)$('tab-'+n).focus()}
const chunks=()=>[T('First, identify the main claim.\n','首先，找出材料的主要观点。\n'),T('Then locate supporting evidence.\n','然后，定位支持观点的证据。\n'),T('Compare exceptions and limitations.\n','接着，比较例外与限制。\n'),T('Finally, turn the material into practice questions.','最后，把材料变成练习问题。')];
function runUI(){
 const focused=document.activeElement?.closest('#run-actions button')?.dataset.action;
 const done=step===4,active=timer!==null;
 $('run-status').textContent=failed?T(step?'Failed · partial output retained':'Failed · no output yet',step?'失败 · 保留部分结果':'失败 · 暂无已生成内容'):canceled?T(step?'Canceled · partial output retained':'Canceled · no output yet',step?'已取消 · 保留部分结果':'已取消 · 暂无已生成内容'):done?T('Complete · simulation only','已完成 · 仅模拟'):paused?T('Paused','已暂停'):T(['Preparing material','Reading material','Organizing notes','Checking result'][step],['准备材料','读取材料','整理笔记','检查结果'][step]);
 $('progress').setAttribute('aria-valuenow',String(step));$('bar').style.width=step*25+'%';$('partial').textContent=done?T('Complete result','完整结果'):step?T('Partial result','部分结果'):T('No result yet','暂无结果');
 $('result').textContent=configs.ai==='stream'||done?chunks().slice(0,step).join(''):T('The final text appears after all stages.','全部阶段结束后展示正文。');
 $('run-actions').innerHTML=action('start',failed||canceled?'Retry from start':'Restart',failed||canceled?'从头重试':'重新开始',active)+action('pause',paused?'Resume':'Pause',paused?'继续':'暂停',done||failed||canceled)+action('fail','Simulate failure','模拟失败',!active)+action('cancel','Cancel','取消',done||failed||canceled);
 if(focused){const button=$('run-actions').querySelector('[data-action="'+focused+'"]');(button&&!button.disabled?button:$('run-actions').querySelector('button:not(:disabled)'))?.focus()}
}
function schedule(){stop();timer=setInterval(()=>{if(document.hidden)return;step++;if(step>=4)stop();runUI()},1000);runUI()}
document.addEventListener('click',event=>{
 if(studioAction(event))return;
 const part=event.target.closest('[data-part]');if(part){selectPagePart(part.dataset.part);return}
 const choice=event.target.closest('[data-config]');if(choice){$('config').value=choice.dataset.config;$('config').dispatchEvent(new Event('change',{bubbles:true}));return}
 const group=event.target.closest('[data-group]');if(group){current=groups.find(g=>g.id===group.dataset.group).items[0];render();$('groups').querySelector('[aria-pressed=true]').focus();return}
 pageAction(event);referenceAction(event);
 const nav=event.target.closest('[data-demo]');if(nav){current=nav.dataset.demo;render();$('navigation').querySelector('[aria-current=true]').focus();return}
 if(event.target.closest('#sample-button')){const b=$('sample-button');b.disabled=true;b.setAttribute('aria-busy','true');b.textContent=T('Generating…','正在生成…');stop();timer=setTimeout(()=>{timer=null;b.disabled=false;b.setAttribute('aria-busy','false');b.textContent=T('Generate quiz','生成测验')},1200)}
 if(event.target.closest('#sample-card'))$('card-status').textContent=T('Item activated in this simulation.','已在模拟中激活条目。');
 const a=event.target.closest('[data-action]')?.dataset.action;if(a==='replay'){stop();$('sample-card').classList.add('play');timer=setTimeout(()=>{$('sample-card')?.classList.remove('play');timer=null},duration+600)}
 if(a==='open-dialog'){returnFocus=event.target.closest('button');$('dialog').classList.toggle('drawer',configs.overlay==='drawer');$('dialog-title').textContent=T('Source material','材料详情');$('dialog-info').textContent=T('Source: evidence lets a reader check a claim; repetition alone does not establish accuracy. Your note remains after closing and reopening, and is cleared on reload.','原文：证据让读者核对说法；重复出现不能证明它准确。下方备注关闭后再打开仍保留，刷新清除。');$('dialog-label').textContent=T('Reading note','阅读备注');$('close-dialog').textContent=T('Close','关闭');$('dialog').showModal()}
 if(event.target.closest('#close-dialog'))$('dialog').close();
 if(a==='feedback'){$('feedback-slot').innerHTML=`<div class="notice ${configs.feedback==='toast'?'toast':''}" role="status">${action('dismiss','Close','关闭')}${T('Simulation complete. No server data was saved.','模拟操作完成，没有保存服务器数据。')}</div>`}
 if(a==='dismiss'){$('feedback-slot').replaceChildren();$('canvas').querySelector('[data-action=feedback]').focus()}
 const accordion=event.target.closest('[id^="acc-"]');if(accordion&&accordion.matches('button')){const open=accordion.getAttribute('aria-expanded')==='true';if(configs.accordion==='single')for(let i=0;i<2;i++){$('acc-'+i).setAttribute('aria-expanded','false');$('acc-'+i).lastElementChild.textContent='+';$('acc-body-'+i).hidden=true}accordion.setAttribute('aria-expanded',String(!open));accordion.lastElementChild.textContent=open?'+':'−';$(accordion.getAttribute('aria-controls')).hidden=open}
 const targetTab=event.target.closest('[role=tab]');if(targetTab)switchTab(Number(targetTab.id.slice(-1)),false);
 if(current==='ai'){if(a==='start'){stop();step=0;paused=canceled=failed=false;schedule()}if(a==='pause'){paused=!paused;if(paused){stop();runUI()}else schedule()}if(a==='fail'||a==='cancel'){stop();failed=a==='fail';canceled=a==='cancel';paused=false;runUI()}}
});
document.addEventListener('change',event=>{if(event.target.id==='config'){const state=captureStudyState();configs[current]=event.target.value;render();restoreStudyState(state);focusConfig()}if(event.target.id==='reduce'){reduce=event.target.checked;motion();descriptions();mountStudy()}});
$('duration').addEventListener('input',e=>{duration=Number(e.target.value);$('duration-value').textContent=duration+' ms';motion();descriptions()});
document.addEventListener('focusout',e=>{if(e.target.id==='sample-input'&&configs.input==='blur')validate()});
document.addEventListener('input',e=>{if(e.target.id==='sample-input'&&e.target.getAttribute('aria-invalid')==='true')validate()});
document.addEventListener('submit',e=>{if(e.target.id==='sample-form'){e.preventDefault();validate(true)}});
document.addEventListener('keydown',e=>{if(current==='tabs'&&e.target.getAttribute('role')==='tab'){let n=tab;if(e.key==='ArrowRight')n=(tab+1)%2;else if(e.key==='ArrowLeft')n=(tab+1)%2;else if(e.key==='Home')n=0;else if(e.key==='End')n=1;else return;e.preventDefault();switchTab(n,true)}});
$('dialog').addEventListener('click',e=>{if(e.target!==$('dialog'))return;const r=$('dialog').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('dialog').close()});
$('dialog').addEventListener('close',()=>returnFocus?.isConnected&&returnFocus.focus());
$('copy').addEventListener('click',async()=>{const snapshot=$('prompt').value;try{await navigator.clipboard.writeText(snapshot);if($('prompt').value!==snapshot)return;$('copy-status').textContent=T('Copied.','已复制。')}catch{if($('prompt').value!==snapshot)return;$('prompt-details').open=true;$('prompt').focus();$('prompt').select();$('copy-status').textContent=T('Select the text and copy manually.','请手动复制已选中的文字。')}});
media.addEventListener('change',()=>{motion();descriptions();mountStudy()});window.addEventListener('pagehide',stop);render();</script></body></html>
